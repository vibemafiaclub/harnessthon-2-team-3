<title>따라가 보기</title>
<style>
:root{color-scheme:light only;
  --bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--soft:#EEF0F3;
  --acc:#2F6BFF;--acc-d:#1F4ED8;--bad:#DC2626;--bad-bg:#FEF2F2}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1380px;margin:0 auto;padding:20px 24px 72px}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--sub);margin-bottom:20px}
.notice b{color:var(--ink)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--sub);margin:0 0 20px}
/* scenario tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-weight:600;font-size:14px;padding:0 16px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button:focus-visible,.nav button:focus-visible,.segs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.side-col{position:sticky;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.side-save{width:132px;padding:0;height:40px;font-size:14px}
.side-saved{width:132px;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#166534;background:#E6F0E9;border-radius:10px}
.fb-more{margin-top:12px}
.prog{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:132px}
.prog .cnt{font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:5px;max-width:112px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;display:block}
.dots i.done{background:#9CA3AF}
.dots i.on{background:var(--acc);width:20px;border-radius:4px}
.nav{display:flex;flex-direction:row;gap:6px}
.nav button{font:inherit;font-size:18px;font-weight:700;width:52px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1}
.nav button.next{background:var(--acc);border-color:var(--acc);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.scene-title{font-size:18px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
.scene-title small{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px}
/* stage */
.stage{display:grid;grid-template-columns:132px 390px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}.phone-col{justify-content:center}.side-col{position:static;align-items:center}.prog{flex-direction:row;width:auto}.dots,.nav{flex-direction:row}.dots i.on{height:8px;width:20px}}
.phone-col{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:12px}
@media (max-width:900px){.phone-col{position:static}}
.legend{font-size:12px;color:var(--sub);text-align:center}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-radius:4px;vertical-align:-2px;margin-right:4px}
.toast{min-height:32px;padding:6px 14px;border-radius:16px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* ===== phone ===== */
.phone{width:390px;height:844px}
.phone{position:relative;flex:none;background:#fff;border:1px solid var(--line);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(31,41,55,.10);user-select:none}
.sb{height:44px;flex:none;background:var(--soft);display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:13px;font-weight:600}
.sb .r{letter-spacing:1px;font-size:11px;color:var(--sub)}
.addr{height:36px;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.addr b{font-weight:600;color:var(--ink);margin-right:6px}
.top{height:56px;flex:none;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);position:relative;background:#fff}
.top .tl{justify-self:start}.top .tr{justify-self:end}
.top .tt{text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:40px;min-width:40px;padding:0 6px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink);cursor:pointer;gap:2px}
.ib .x{font-size:20px;line-height:1}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;position:relative;background:var(--bg)}
.body::-webkit-scrollbar{width:0}
.ctabar{flex:none;padding:12px 20px;border-top:1px solid var(--line);background:#fff;position:relative}
.hind{height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.hind i{width:134px;height:5px;border-radius:3px;background:var(--ink)}
.tabbar{height:56px;flex:none;border-top:1px solid var(--line);display:flex;position:relative;background:#fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub);gap:4px;cursor:pointer}
.tab i{width:22px;height:22px;border-radius:7px;border:1.5px solid currentColor;display:block;opacity:.7}
.tab.on{color:var(--acc);font-weight:700}
.tab.on i{background:var(--acc);border-color:var(--acc);opacity:1}
/* components */
.btn{height:52px;width:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;cursor:pointer;position:relative;gap:8px;padding:0 16px}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri.pressed{background:var(--acc-d);transform:scale(.985)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--sub);font-weight:500;height:44px}
.btn.sm{height:40px;font-size:14px;padding:0 14px;width:auto;flex:none}
.btn.dis{opacity:.38;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.card.soft{background:var(--soft);border-color:transparent}
.card.warn{background:#FFF7ED;border-color:#FDBA74}
.card.bad{background:var(--bad-bg);border-color:#FCA5A5;color:var(--bad)}
.card.center{text-align:center}
.card .t{font-weight:600;font-size:15px}
.card .h{font-size:13px;color:var(--sub);margin-top:2px}
.card.tight{padding:4px 16px}
.row{height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--soft);cursor:pointer}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-size:12px;color:var(--sub);white-space:normal}
.row .rt{color:var(--sub);font-size:13px;flex:none}
.row.dim{opacity:.45}
.grp{height:44px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.grp .rt{margin-left:auto;font-weight:400;color:var(--sub);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:28px;padding:0 12px;border-radius:14px;background:var(--soft);color:var(--ink);font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip.dash{background:transparent;border:1px dashed #9CA3AF;color:var(--sub)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--soft);color:var(--sub);font-size:11px;font-weight:600;white-space:nowrap;vertical-align:middle;margin-left:6px}
.tag.ink{background:var(--ink);color:#fff}
.tag.red{background:var(--bad);color:#fff}
.tag.side{background:#fff;border:1px solid var(--line)}
.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px;cursor:text}
.field .lb{font-size:12px;color:var(--sub);display:block}
.field .v{font-size:16px;line-height:1.4}
.field .v.ph{color:#9CA3AF}
.field.err{border-color:var(--bad)}
.err-t{color:var(--bad);font-size:12px;margin:-6px 2px 0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg span{flex:1;height:32px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(31,41,55,.08)}
.sw{width:40px;height:24px;border-radius:12px;background:#D1D5DB;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--ink)}.sw.on::after{left:18px}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #9CA3AF;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.cb.on{background:var(--ink);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--sub);height:20px}
.cal .day{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:14px;cursor:pointer;gap:2px;position:relative}
.cal .day.blank{cursor:default}
.cal .day.sel{background:var(--acc);color:#fff;font-weight:700}
.cal .day.pick{background:#fff;border:1.5px solid var(--acc);color:var(--acc);font-weight:700}
.cal .day .dd{display:flex;gap:2px;height:5px}
.cal .day .dd b{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block}
.cal .day.sel .dd b{background:#fff}
.cal .day .ov{position:absolute;top:2px;right:2px;font-size:9px;font-weight:700;color:#fff;background:var(--bad);border-radius:5px;padding:0 4px;line-height:14px}
.cal .day .wn{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:#C2410C}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mx th,.mx td{padding:0 4px;height:40px;text-align:center;border-bottom:1px solid var(--soft)}
.mx tr:last-child td{border-bottom:0}
.mx th{background:var(--soft);font-weight:600;font-size:12px;color:var(--sub)}
.mx td.nm{text-align:left;padding-left:12px;font-weight:600}
.mx td.o{font-weight:700}
.mx td.x{color:var(--sub)}
.mx td.g{color:#9CA3AF;background:#FAFAFB;font-size:11px}
.mx tr.hi td{background:#EEF3FF}
.big{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
.hint{font-size:13px;color:var(--sub)}
.two{display:flex;gap:8px}.two>*{flex:1}
.spacer{flex:1}
.ok-circle{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
.skels{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft) 25%,#F7F8FA 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.skel.tall{height:56px;border-radius:12px}.skel.w60{width:60%}.skel.w80{width:80%}.skel.w40{width:40%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite;display:inline-block}
.spin.dark{border-color:var(--line);border-top-color:var(--ink)}
@keyframes rot{to{transform:rotate(360deg)}}
.itoast{position:absolute;left:20px;right:20px;bottom:110px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px}
.itoast.bad{background:var(--bad)}
.itoast u{text-decoration:none;font-weight:700;white-space:nowrap}
.dimv{position:absolute;inset:0;background:rgba(31,41,55,.45);z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 20px 0;z-index:3;display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:#D1D5DB;margin:0 auto 4px}
.sheet .sh-top{height:44px;display:flex;align-items:center}
.sheet .sh-top .tt{flex:1;font-weight:700;font-size:16px}
.sheet .hind{margin:0 -20px}
/* tour overlays */
.lab{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:rgba(31,41,55,.72);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;font-family:inherit}
.hl{outline:3px solid var(--acc);outline-offset:3px;animation:pulse 1.4s infinite;z-index:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,255,.5)}70%{box-shadow:0 0 0 14px rgba(47,107,255,0)}100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}}
.bub{position:absolute;z-index:7;background:var(--acc);color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 16px rgba(47,107,255,.35);right:calc(100% + 10px);transform:translateY(-50%)}
.bub::after{content:"";position:absolute;left:100%;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--acc)}
.phone-col{position:sticky;top:12px;overflow:visible}
@media (max-width:1180px){.bub{right:auto;left:0;top:-38px!important;transform:none}.bub::after{left:20px;top:100%;margin-top:0;border-left-color:transparent;border-top-color:var(--acc)}}
.arrows{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
.arrows.on{display:block}
@media (prefers-reduced-motion:reduce){.hl,.skel,.spin{animation:none}}
/* right panel */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.sec .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;margin-bottom:10px}
.sec .eyebrow b{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.quote{font-size:16px;line-height:1.6;margin:0}
.quote .who{display:inline-block;font-size:12px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.lay{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lay li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lay li b{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(31,41,55,.72);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.lay li span{padding-top:2px}
.lay li span em{font-style:normal;font-weight:600}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.chain .c{height:30px;padding:0 12px;border-radius:15px;background:var(--soft);font-size:13px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.chain .c.first{background:var(--acc);color:#fff}
.chain .c.ok{background:#E6F0E9;color:#166534}
.chain .ar{color:#9CA3AF;font-weight:700}
.chain.fail .c{background:var(--bad-bg);color:var(--bad)}
.none{font-size:13px;color:var(--sub)}
.segs-lb{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs button{font:inherit;font-size:13px;font-weight:600;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.segs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.segs button:disabled{opacity:.35;cursor:default}
.seg-note{font-size:12px;color:var(--sub);margin-top:8px;min-height:18px}
.gaze{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gaze p{margin:0;flex:1;min-width:200px;font-size:14px}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.tg i{width:40px;height:24px;border-radius:12px;background:#D1D5DB;position:relative;display:block;transition:background .15s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg.on i{background:var(--acc)}.tg.on i::after{left:18px}
.foot{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
/* feedback */
.counter{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:#EEF3FF;border-radius:14px;padding:3px 12px;vertical-align:4px;margin-left:8px}
.dots i.fb{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.saved{margin-left:auto;font-size:12px;font-weight:600;color:#166534;text-transform:none;letter-spacing:0}
.fb-warn{font-size:12px;color:var(--sub);background:var(--soft);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.react{display:flex;gap:6px}
.react button{flex:1;font:inherit;font-size:14px;font-weight:600;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.react button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.react button:focus-visible,.marks button:focus-visible,.save:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fb-lb{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.marks button{font:inherit;font-size:13px;height:32px;padding:0 12px 0 8px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.marks button b{width:20px;height:20px;border-radius:50%;background:rgba(31,41,55,.72);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.marks button.on{background:#EEF3FF;border-color:var(--acc);color:var(--acc)}
.marks button.on b{background:var(--acc)}
textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff}
textarea::placeholder{color:#9CA3AF}
.fb-row{display:flex;justify-content:flex-end;margin-top:8px}
.save{font:inherit;font-weight:700;font-size:14px;height:36px;padding:0 20px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.overall{margin-top:28px}
</style>

<div class="wrap">
<h1>따라가 보기 — 청첩장모임 스케줄러 <span class="counter" id="fb-count">의견 남긴 장면 0개</span></h1>
<p class="sub">수진(예비신부)이 대학 동기 모임 날짜를 잡는 이야기입니다.</p>

<div class="tabs" id="tabs"></div>
<h2 class="scene-title" id="stitle"></h2>

<div class="stage">
  <div class="side-col">
    <div class="prog">
      <div class="nav"><button id="prev" title="이전 장면">‹</button><button id="next" class="next" title="다음 장면">›</button></div>
      <span class="cnt" id="cnt">1 / 8</span>
      <div class="dots" id="dots"></div>
    </div>
    <button class="save side-save" id="fb-save" title="이 장면 의견 저장" hidden>저장</button>
    <span class="side-saved" id="side-saved" hidden>저장됨 ✓</span>
  </div>
  <div class="phone-col">
    <div class="phone" id="phone"></div>
        <div class="toast" id="toast">이 투어에서는 안 쓰는 버튼이에요</div>
  </div>
  <div class="panel">
    <section class="sec"><div class="eyebrow"><b>1</b>지금 상황</div><p class="quote" id="p-sit"></p></section>
    <section class="sec"><div class="eyebrow"><b>2</b>화면 구성</div><ul class="lay" id="p-lay"></ul></section>
    <section class="sec"><div class="eyebrow"><b>3</b>누르면 이렇게 돼요</div><div id="p-res"></div>
      <div class="segs-lb">이 화면의 다른 모습</div><div class="segs" id="segs"></div><div class="seg-note" id="segnote"></div></section>
    <section class="sec"><div class="eyebrow"><b>4</b>시선 흐름</div><div class="gaze"><p id="p-gaze"></p><label class="tg" id="tg"><i></i>흐름 화살표 보기</label></div></section>
    <section class="sec fb" id="fb">
      <div class="eyebrow"><b>5</b>이 장면, 어때요?<span class="saved" id="fb-saved"></span></div>
      <div class="fb-warn" id="fb-warn" hidden>이 환경에서는 브라우저에만 저장돼요</div>
      <div class="react" id="react">
        <button data-r="good">괜찮아요 👍</button><button data-r="confusing">어색해요 🤔</button>
      </div>
      <div class="fb-more" id="fb-more" hidden>
        <div class="fb-lb">어색한 곳을 눌러 주세요</div>
        <div class="marks" id="marks"></div>
        <textarea id="fb-text" rows="2" placeholder="예: 저장 버튼이 뭘 저장하는 건지 모르겠어요"></textarea>
      </div>
    </section>
  </div>
</div>

<section class="sec overall" id="overall">
  <div class="eyebrow"><b>전체</b>전체 의견<span class="saved" id="ov-saved"></span></div>
  <p class="hint" style="margin:0 0 8px">장면과 상관없이 전체적으로 느낀 점을 적어 주세요.</p>
  <textarea id="ov-text" rows="4" placeholder="예: 전체적으로 버튼이 너무 많아 보여요 / 지인풀이라는 말이 낯설어요"></textarea>
  <div class="fb-row"><button class="save" id="ov-save">저장</button></div>
</section>
</div>

<script>
/* ---------- 상태 이름 ---------- */
const ST={default:'기본',pressed:'눌렀을 때',loading:'로딩 중',success:'성공',fail:'실패',empty:'비어있음',disabled:'비활성'};
const ST_NOTE={pressed:'버튼을 손가락으로 누르고 있는 순간 — 색이 진해집니다.',loading:'서버 응답을 기다리는 잠깐 — 회색 막대가 반짝입니다.',success:'잘 됐을 때 보이는 모습입니다.',fail:'잘못됐을 때 — 빨간 안내만 붙고 나머지는 그대로예요.',empty:'보여줄 내용이 없을 때 — 안내문과 첫 행동 버튼이 나옵니다.',disabled:'아직 누를 수 없는 상태 — 버튼이 흐립니다.',default:''};

/* ---------- 공통 조각 ---------- */
const sb=()=>`<div class="sb"><span>9:41</span><span class="r">●●● ▮</span></div>`;
const addr=()=>`<div class="addr"><b>moim.app/r/7f3k2</b>앱이 아니라 브라우저 창이에요</div>`;
const hind=()=>`<div class="hind"><i></i></div>`;
const back=(t='')=>`<span class="ib" data-act="back">‹ ${t}</span>`;
const close_=()=>`<span class="ib" data-act="close"><span class="x">×</span></span>`;
const TABS4=[['home','홈'],['meet','모임'],['pool','지인풀'],['set','설정']];
function tabbar(a){return `<div class="tabbar">${TABS4.map(([k,l])=>`<div class="tab${k===a?' on':''}" data-act="tab-${k}"><i></i>${l}</div>`).join('')}</div>`}
function topbar(l,t,r){return `<div class="top"><div class="tl">${l||''}</div><div class="tt">${t}</div><div class="tr">${r||''}</div></div>`}
function frame(o){
  return sb()+(o.guest?addr():'')+topbar(o.left,o.title,o.right)
    +`<div class="body">${o.body}</div>`
    +(o.cta?`<div class="ctabar">${o.cta}</div>`:'')
    +(o.tab?tabbar(o.tab):'')+hind()
    +(o.over||'');
}
function sheet(inner){return `<div class="dimv"></div><div class="sheet">${inner}${hind()}</div>`}
const skel=()=>`<div class="skels"><div class="skel w60"></div><div class="skel tall"></div><div class="skel w80"></div><div class="skel tall"></div><div class="skel w40"></div></div>`;
const pri=(act,txt,cls='')=>`<div class="btn pri ${cls}" data-act="${act}">${txt}</div>`;
const sec=(act,txt,cls='')=>`<div class="btn sec ${cls}" data-act="${act}">${txt}</div>`;
const loadBtn=(txt)=>`<div class="btn pri dis"><span class="spin"></span>${txt}</div>`;
const itoast=(t,link,bad)=>`<div class="itoast${bad?' bad':''}"><span>${t}</span>${link?`<u>${link}</u>`:''}</div>`;
const field=(lb,v,o={})=>`<div class="field${o.err?' err':''}" data-act="${o.act||'field'}"><span class="lb">${lb}</span><span class="v${o.ph?' ph':''}">${v}</span></div>`;

/* 2026년 10월 달력: 1일이 목요일 */
function cal(o={}){
  const sel=o.sel||[],pick=o.pick||[],dots=o.dots||{},warn=o.warn||[],ov=o.ov||[];
  let h=`<div class="cal">${['일','월','화','수','목','금','토'].map(w=>`<div class="wd">${w}</div>`).join('')}`;
  for(let i=0;i<4;i++)h+=`<div class="day blank"></div>`;
  for(let d=1;d<=31;d++){
    const cls=['day'];if(sel.includes(d))cls.push('sel');if(pick.includes(d))cls.push('pick');
    let inner=`${d}`;
    const n=dots[d]||0;if(n)inner+=`<span class="dd">${'<b></b>'.repeat(n)}</span>`;
    if(ov.includes(d))inner+=`<span class="ov">겹침</span>`;
    if(warn.includes(d))inner+=`<span class="wn">!</span>`;
    h+=`<div class="${cls.join(' ')}" data-act="day-${d}">${inner}</div>`;
  }
  return h+`</div>`;
}
function matrix(rows,hi){
  return `<table class="mx"><tr><th></th><th>10/11 토</th><th>10/12 일</th><th>10/18 토</th></tr>`
   +rows.map(r=>`<tr${hi&&r[0]===hi?' class="hi"':''}><td class="nm">${r[0]}</td>${r.slice(1).map(c=>c==='—'?`<td class="g">답 없음</td>`:`<td class="${c==='O'?'o':'x'}">${c}</td>`).join('')}</tr>`).join('')+`</table>`;
}

/* ---------- 화면 ①~⑰ ---------- */
const SCR={
  /* ① 홈 */
  home(v,st){
    const title='2026년 10월';
    let body;
    if(st==='loading')body=`<div class="seg"><span class="on">전체</span><span>신부측</span><span>신랑측</span></div>`+skel();
    else if(st==='empty')body=`<div class="seg"><span class="on">전체</span><span>신부측</span><span>신랑측</span></div>`+cal({})+`<div class="card center" style="padding:28px 16px"><div class="big">아직 확정된 모임이 없어요</div><div class="hint" style="margin-top:6px">지인을 등록하고 모임을 만들면<br>확정된 날짜가 여기 점으로 찍혀요</div></div>`;
    else{
      const seg=`<div class="seg"><span class="on" data-act="seg">전체</span><span data-act="seg">신부측</span><span data-act="seg">신랑측</span></div>`;
      if(v==='oct12'){
        body=seg+cal({sel:[12],dots:{12:2,18:2},ov:[12]})
        +`<div class="hint">10/12 (일) · 모임 2개 · <b style="color:var(--bad)">같은 시간에 겹쳐요</b></div>`
        +`<div class="card tight"><div class="row" data-act="item"><span class="nm"><b>오후 1시 박 팀장</b><span class="tag side">신랑측</span><span class="tag">1:1</span><small>확정 · 회사 근처</small></span></div>
           <div class="row" data-act="item"><span class="nm"><b>오후 1시 동네 친구</b><span class="tag side">신부측</span><small>확정 · 하늘·은비 외 2명</small></span><span class="tag red" data-act="overlap-badge" style="height:28px;padding:0 12px;font-size:13px;cursor:pointer">겹침 — 옮길까요?</span></div></div>`;
      }else if(v==='oct18'){
        body=seg+cal({sel:[18],dots:{12:2,18:2},ov:[12]})
        +`<div class="hint">10/18 (토) · 모임 2개 · 시간 안 겹침</div>`
        +`<div class="card tight"><div class="row" data-act="item"><span class="nm"><b>오후 1시 박 팀장</b><span class="tag side">신랑측</span><span class="tag">확정</span><small>1:1 · 회사 근처</small></span></div>
           <div class="row" data-act="item"><span class="nm"><b>오후 6시 대학 동기</b><span class="tag side">신부측</span><span class="tag">확정</span><small>지현·은비 · 강남역 근처</small></span></div></div>
           <div class="hint">10/12 (일)에는 빨간 "겹침"이 붙어 있어요 — 눌러서 확인해 보세요.</div>`;
      }else{
        body=seg+cal({sel:[18],dots:{12:2,18:1},ov:[12]})
        +`<div class="hint">10/18 (토) · 모임 1개</div>`
        +`<div class="card tight"><div class="row" data-act="item"><span class="nm"><b>오후 1시 박 팀장</b><span class="tag side">신랑측</span><span class="tag">확정</span><small>1:1 · 회사 근처</small></span></div></div>
           <div class="hint">점이 찍힌 날 = 확정된 모임이 있는 날. 결혼식(11/21)까지 D-77.</div>`;
      }
    }
    return frame({left:`<span class="ib" data-act="prev-month">‹ 9월</span>`,title,right:`<span class="ib" data-act="next-month">11월 ›</span>`,body,
      cta:st==='empty'?pri('new-meeting','+ 첫 모임 만들기'):pri('new-meeting','+ 새 모임'),tab:'home'});
  },
  /* ⑭ 지인풀 */
  pool(v,st){
    const seg=`<div class="seg"><span class="on" data-act="seg">신부측 (수진)</span><span data-act="seg">신랑측 (민준)</span></div>`;
    let body;
    if(st==='loading')body=seg+skel();
    else if(st==='empty')body=seg+`<div class="card center" style="padding:28px 16px"><div class="big">아직 지인이 없어요</div><div class="hint" style="margin-top:6px">청첩장을 드릴 분들을 한 명씩 등록해 주세요.<br>한 사람을 여러 그룹에 넣을 수 있어요.</div></div>`;
    else{
      const after=v==='after';
      body=seg+`<div class="field" data-act="search"><span class="v ph">이름·연락처 검색</span></div>
      <div class="chips"><span class="chip on" data-act="chip">전체</span><span class="chip" data-act="chip">대학</span><span class="chip" data-act="chip">직장</span><span class="chip" data-act="chip">동네</span><span class="chip" data-act="chip">1:1</span></div>
      <div class="card tight"><div class="grp" data-act="grp">▾ 대학<span class="rt">${after?3:2}명</span></div>
        <div class="row" data-act="person"><span class="nm">지현</span><span class="chip" style="height:22px;font-size:11px;padding:0 8px">대학</span></div>
        <div class="row" data-act="person"><span class="nm">태호</span><span class="chip" style="height:22px;font-size:11px;padding:0 8px">대학</span></div>
        ${after?`<div class="row" data-act="person" style="background:#EEF3FF;margin:0 -16px;padding:0 16px;border-radius:0 0 12px 12px"><span class="nm">은비<span class="tag ink">방금 추가</span></span><span class="chip" style="height:22px;font-size:11px;padding:0 8px">대학</span><span class="chip" style="height:22px;font-size:11px;padding:0 8px">동네</span></div>`:''}
      </div>
      <div class="card tight"><div class="grp" data-act="grp">▸ 직장<span class="rt">박 팀장 <span class="tag">1:1</span> 외 3명</span></div></div>
      <div class="card tight"><div class="grp" data-act="grp">▸ 동네<span class="rt">하늘${after?', 은비':''} 외 3명</span></div></div>
      <div class="hint">모임이 이미 확정된 지인은 "확정" 표시가 붙고 흐리게 보여요.</div>`;
    }
    return frame({title:`지인풀 · ${st==='empty'?0:(v==='after'?12:11)}명`,body,cta:pri('add-friend','+ 지인 추가'),tab:'pool'});
  },
  /* ⑮ 지인 등록 */
  addFriend(v,st){
    if(st==='success')return SCR.pool('after','default').replace('</div><div class="hind">',`</div>${itoast('은비를 추가했어요','실행 취소')}<div class="hind">`);
    const empty=st==='empty',fail=st==='fail';
    const body=field('이름 (필수)',empty?'예: 은비':'은비',{ph:empty,act:'f-name'})
      +field('연락처',empty?'010-0000-0000':'010-1234-5678',{ph:empty,err:fail,act:'f-phone'})
      +(fail?`<div class="err-t">이미 등록된 연락처예요 — 지현 (대학)과 같아요</div>`:'')
      +sec('import','연락처에서 가져오기')
      +`<div class="card"><div class="hint" style="margin-bottom:8px">그룹 (여러 개 선택 가능)</div><div class="chips"><span class="chip${empty?'':' on'}" data-act="chip">대학${empty?'':' ✓'}</span><span class="chip" data-act="chip">직장</span><span class="chip${empty?'':' on'}" data-act="chip">동네${empty?'':' ✓'}</span><span class="chip dash" data-act="chip">+ 새 그룹</span></div></div>
      <div class="card tight"><div class="row" data-act="oneone"><span class="nm">1:1로 따로 만나야 해요<small>켜면 그룹 모임에 묶이지 않고 혼자 모임을 만들어요 (박 팀장처럼)</small></span><span class="sw"></span></div></div>`;
    const cta=st==='loading'?loadBtn('저장 중…'):pri('save-friend','저장',st==='pressed'?'pressed':(empty?'dis':''));
    return frame({left:close_(),title:'지인 추가',body,cta});
  },
  /* ② 모임 목록 */
  meetings(v,st){
    const soon=v==='soon';
    const seg=`<div class="seg"><span class="${soon?'':'on'}" data-act="seg">회신 대기 ${soon?0:1}</span><span class="${soon?'on':''}" data-act="seg">확정 임박 ${soon?1:0}</span><span data-act="seg">확정 1</span><span data-act="seg">완료 1</span></div>`;
    let body;
    if(st==='loading')body=seg+skel();
    else if(st==='empty')body=seg+`<div class="card center" style="padding:28px 16px"><div class="big">회신을 기다리는 모임이 없어요</div><div class="hint" style="margin-top:6px">지인을 골라 새 모임을 만들면 여기 쌓여요</div></div>`;
    else if(soon)body=seg+`<div class="hint">결혼식(11/21)까지 2주 안쪽 모임은 맨 위에 고정돼요.</div>
      <div class="card" data-act="card-soon"><div class="t">대학 동기<span class="tag ink">확정 임박</span><span class="tag side">신부측</span></div><div class="h">마감 지남 · 2/3 회신 · 답한 2명 모두 가능: 10/18(토)</div><div class="h">태호 답 없음</div></div>
      <div class="hint">확정 칸: 박 팀장 (10/18 오후 1시) · 완료 칸: 하늘·동네 (9/27 다녀옴)</div>`;
    else body=seg+`<div class="hint">결혼식(11/21)까지 2주 안쪽 모임은 맨 위에 고정돼요.</div>
      <div class="card" data-act="card"><div class="t">동네 친구<span class="tag side">신부측</span></div><div class="h">1/4 회신 · 마감 2일 전 · 하늘·은비 외 2명</div></div>
      <div class="hint">확정 칸: 박 팀장 (10/18 오후 1시) · 완료 칸: 하늘·동네 (9/27 다녀옴) — 완료 모임은 흐리게, 편집 잠금</div>`;
    return frame({title:'모임',body,cta:pri('new-meeting','+ 새 모임'),tab:'meet'});
  },
  /* ③ 구성원 고르기 */
  pick(v,st){
    let body,cta;
    if(st==='loading'){body=skel();cta=loadBtn('만드는 중…');}
    else if(st==='empty'){
      body=`<div class="card center" style="padding:28px 16px"><div class="big">먼저 지인을 등록해 주세요</div><div class="hint" style="margin-top:6px">모임에 넣을 사람이 아직 없어요</div></div>`+pri('add-friend','+ 지인 추가');
      cta=pri('create-meeting','0명으로 모임 만들기','dis');
    }else{
      const none=st==='disabled';
      const cb=(on)=>`<span class="cb${on?' on':''}">${on?'✓':''}</span>`;
      body=`<div class="card tight"><div class="row" data-act="spouse"><span class="nm"><b>민준도 같이 가요</b><small>양가가 함께 나가는 모임이면 켜요</small></span><span class="sw"></span></div></div>
      <div class="card tight"><div class="grp" data-act="grp">${cb(!none)}대학 · 3명 전체 선택<span class="rt">▾</span></div>
        <div class="row" data-act="person">${cb(!none)}<span class="nm">지현</span></div>
        <div class="row" data-act="person">${cb(!none)}<span class="nm">태호</span></div>
        <div class="row" data-act="person">${cb(!none)}<span class="nm">은비<span class="tag">동네 모임에도 있음</span></span></div></div>
      <div class="card tight"><div class="grp" data-act="grp">${cb(false)}직장 · 4명<span class="rt">▸</span></div>
        <div class="row dim"><span class="cb"></span><span class="nm">박 팀장<span class="tag">1:1</span></span><span class="rt">혼자 모임</span></div></div>
      <div class="card tight"><div class="grp" data-act="grp">${cb(false)}동네 · 5명<span class="rt">▸</span></div></div>`;
      cta=none?pri('create-meeting','모임 만들기','dis'):pri('create-meeting','3명으로 모임 만들기',st==='pressed'?'pressed':'');
    }
    return frame({left:close_(),title:'새 모임 · 구성원 고르기',body,cta});
  },
  /* ④ 이름 시트 */
  nameSheet(v,st){
    const inner=`<div class="sh-top"><span class="tt">모임 이름</span>${close_()}</div>`
      +field('이름','대학 동기',{act:'f-mname'})
      +`<div class="hint">구성원: 지현·태호·은비 (3명) · 신부측</div>`
      +(st==='loading'?loadBtn('만드는 중…'):pri('sheet-create','만들기',st==='pressed'?'pressed':''))+`<div style="height:4px"></div>`;
    return SCR.pick('','default').replace(hind(),hind()+sheet(inner));
  },
  /* ⑤ 모임 상세 (후보 없음) */
  detail(v,st){
    const body=st==='loading'?skel():`<div class="card soft"><div class="t">회신 대기 전</div><div class="h">신부측 · 아직 후보를 보내지 않았어요</div></div>
      <div class="card tight"><div class="row" data-act="members"><span class="nm"><b>구성원 3명</b><small>지현 · 태호 · 은비</small></span><span class="rt">수정 ›</span></div></div>
      <div class="card center" style="padding:32px 16px"><div class="big">아직 날짜 후보가 없어요</div><div class="hint" style="margin-top:6px">후보 날짜를 몇 개 골라 보내면<br>구성원이 링크로 가능·불가능을 답해요</div></div>
      <div class="two">${sec('share','링크 공유','dis')}${sec('cancel','모임 취소')}</div>`;
    return frame({left:back('모임'),title:'대학 동기',right:`<span class="ib" data-act="more">⋯</span>`,body,cta:pri('send-cands','날짜 후보 보내기')});
  },
  /* ⑥ 후보 등록 */
  cands(v,st){
    const none=st==='disabled';
    const mon=`<div class="seg" style="background:transparent;padding:0"><span data-act="prev-month" style="flex:0 0 44px">‹</span><span style="font-weight:700;color:var(--ink)">2026년 10월</span><span data-act="next-month" style="flex:0 0 44px">›</span></div>`;
    let body;
    if(st==='loading')body=mon+skel();
    else body=mon+cal(none?{}:{pick:[11,12,18],warn:[12]})
      +(none?`<div class="hint">주말 날짜를 탭해서 후보로 고르세요. 여러 개 고를 수 있어요.</div>`
        :`<div class="card warn"><b>! 10/12 (일)</b> — 이날 오후 1시 '박 팀장' 모임 있음 (신랑측)</div><div class="hint">고른 후보 3개: 10/11 토 · 10/12 일 · 10/18 토</div>`)
      +(st==='fail'?`<div class="card bad"><b>후보를 보내지 못했어요</b><div style="font-size:13px;margin-top:2px">연결을 확인하고 다시 눌러 주세요</div></div>`:'')
      +field('시간대 (선택)','저녁',{act:'f-time'})
      +`<div class="card"><div class="hint" style="margin-bottom:8px">회신 마감</div><div class="seg"><span data-act="seg">1일 뒤</span><span class="on" data-act="seg">3일 뒤 ✓</span><span data-act="seg">7일 뒤</span><span data-act="seg">직접</span></div></div>`;
    const cta=st==='loading'?loadBtn('보내는 중…'):none?pri('send-list','후보 보내기','dis'):pri('send-list',st==='fail'?'다시 보내기':'후보 3개 보내기');
    return frame({left:back(),title:'날짜 후보 고르기',body,cta});
  },
  /* ⑧ 회신 현황 (v: first / later / final) */
  replies(v,st){
    const cnt=v==='first'?'1/3':'2/3';
    const status=v==='final'?`<div class="card soft"><div class="t">확정 임박<span class="tag side">신부측</span></div><div class="h">2/3 회신 · 마감 지남 (10/8)</div></div>`
      :`<div class="card soft"><div class="t">회신 대기<span class="tag side">신부측</span></div><div class="h">${cnt} 회신 · ${v==='first'?'마감 3일 전 (10/8)':'마감 1일 전 (10/8)'}</div></div>`;
    let body,cta;
    if(st==='loading'){body=status+skel();cta=pri('confirm-date','확정하기','dis');}
    else if(st==='empty'){
      body=`<div class="card soft"><div class="t">회신 대기<span class="tag side">신부측</span></div><div class="h">0/3 회신 · 마감 3일 전 (10/8)</div></div>`
        +matrix([['지현','—','—','—'],['은비','—','—','—'],['태호','—','—','—']])
        +`<div class="card center"><div class="t">아직 아무도 답하지 않았어요</div><div class="h">링크를 다시 보내거나 마감을 늘릴 수 있어요</div><div class="two" style="margin-top:12px">${sec('share','링크 다시 보내기')}${sec('extend','마감 연장')}</div></div>`;
      cta=pri('confirm-date','확정하기 (마감 전)','dis');
    }else if(st==='success'){
      body=`<div class="card soft"><div class="t">전원 회신</div><div class="h">3/3 회신 · 마감 전이지만 바로 확정할 수 있어요</div></div>
        <div class="card" style="border-color:var(--acc)"><b>3명 모두 가능한 날: 10/18 (토)</b></div>`
        +matrix([['지현','O','X','O'],['은비','X','O','O'],['태호','O','X','O']])
        +`<div class="two">${sec('members','구성원 수정')}${sec('add-cand','후보 추가')}${sec('share','링크 공유')}</div>`;
      cta=pri('confirm-date','10/18로 확정');
    }else{
      const rows=v==='first'?[['지현','O','X','O'],['은비','—','—','—'],['태호','—','—','—']]:[['지현','O','X','O'],['은비','X','O','O'],['태호','—','—','—']];
      body=status
        +(v==='final'?`<div class="card" style="border-color:var(--acc)"><b>답한 2명 모두 가능한 날: 10/18 (토)</b></div>`:'')
        +matrix(rows)
        +(v==='first'?`<div class="card"><div>은비·태호 — 아직 답 없음</div><div class="hint">마감 하루 전에 자동으로 한 번 더 알려요</div></div>`
          :`<div class="card"><div>태호 — 답 없음${v==='final'?'. 빼고 확정할까요?':''}</div><div class="two" style="margin-top:10px">${sec('remind','다시 알림')}${sec('extend','마감 연장')}</div></div>`)
        +`<div class="two">${sec('members','구성원 수정')}${sec('add-cand','후보 추가')}${sec('share','링크 공유')}</div>`;
      cta=v==='final'?pri('confirm-date','10/18로 확정 (태호 제외)'):pri('confirm-date','확정하기 (마감 전)','dis');
    }
    return frame({left:back('모임'),title:'대학 동기',right:`<span class="ib" data-act="more">⋯</span>`,body,cta});
  },
  /* ⑦ 공유 시트 */
  share(v,st){
    const base=SCR.replies('empty','default');
    const inner=`<div class="sh-top"><span class="tt">구성원에게 후보 보내기</span>${close_()}</div>
      <div class="hint">지현·태호·은비에게 각자 링크가 가요. 앱이 없어도 열려요.</div>
      ${pri('kakao','카카오톡으로 링크 보내기',st==='pressed'?'pressed':'')}${sec('copy','링크 복사')}${sec('sms','문자로 보내기')}<div style="height:4px"></div>`;
    let out=base.replace(hind(),hind()+sheet(inner));
    if(st==='fail')out=out.replace('<div class="hind"><i></i></div></div>',itoast('링크를 보내지 못했어요','다시 시도',true)+'<div class="hind"><i></i></div></div>');
    return out;
  },
  /* ⑫ 게스트 응답 */
  guest(v,st){
    if(st==='success')return SCR.guestDone('','default');
    const over=st==='fail';
    const opt=(d,a)=>`<div class="card"><div style="margin-bottom:8px"><b>${d}</b> 저녁</div><div class="two"><div class="btn sec${over?' dis':''}" data-act="opt" style="height:44px;${a==='o'&&!over?'background:var(--ink);color:#fff;border-color:var(--ink)':''}">가능${a==='o'?' ✓':''}</div><div class="btn sec${over?' dis':''}" data-act="opt" style="height:44px;${a==='x'&&!over?'background:var(--ink);color:#fff;border-color:var(--ink)':''}">불가능${a==='x'?' ✓':''}</div></div></div>`;
    let body;
    if(st==='loading')body=skel();
    else body=`<div class="big">수진 님이 날짜를 물어봐요</div><div class="hint" style="margin-top:-6px">대학 동기 모임 · 지현 님께 · 회신 마감 10/8 (목)까지</div>`
      +(over?`<div class="card bad"><b>회신이 마감됐어요 (10/8)</b><div style="font-size:13px;margin-top:2px">수진 님이 날짜를 정하면 이 번호로 알려드려요</div></div>`:'')
      +opt('10/11 (토)','o')+opt('10/12 (일)','x')+opt('10/18 (토)','o')
      +field('한마디 (선택)','18일이 제일 좋아요!',{act:'f-msg'})
      +`<div class="card tight"><div class="row" data-act="other"><span class="nm">같은 번호로 받은 다른 초대 1건<small>하늘 님의 동네 모임</small></span><span class="rt">›</span></div></div>`;
    const cta=st==='loading'?loadBtn('보내는 중…'):over?pri('guest-submit','마감됐어요','dis'):pri('guest-submit','보내기',st==='pressed'?'pressed':'');
    return frame({guest:true,title:'날짜 답하기',body,cta});
  },
  /* ⑬ 게스트 완료 */
  guestDone(v,st){
    const fixed=st==='success';
    const body=st==='loading'?skel():`<div class="spacer"></div><div class="center" style="text-align:center"><div class="ok-circle">✓</div><div class="big">${fixed?'10/18 (토) 저녁 6시로 정해졌어요':'답변이 전달됐어요'}</div><div class="hint" style="margin-top:6px">${fixed?'강남역 근처 · 자세한 장소는 수진 님이 다시 알려요':'수진 님이 날짜를 정하면<br>이 번호로 다시 알려드릴게요'}</div></div>
      <div class="card"><div class="hint">내 답변</div>10/11 가능 · 10/12 불가능 · 10/18 가능</div>
      ${fixed?'':sec('edit','답변 고치기 (마감 10/8까지)')}
      <div class="card tight"><div class="row" data-act="other"><span class="nm">같은 번호로 받은 다른 초대 1건<small>하늘 님의 동네 모임</small></span><span class="rt">›</span></div></div><div class="spacer"></div>`;
    return frame({guest:true,title:'답변 완료',body,cta:pri('notify',fixed?'달력에 추가':'확정되면 알림 받기')});
  },
  /* ⑨ 확정 입력 */
  confirm(v,st){
    const body=st==='loading'?skel():`<div class="card soft"><div class="hint">확정 날짜</div><span class="big">10/18 (토)</span> 저녁<div class="hint">지현·은비 참석 · 태호 제외</div></div>`
      +(st==='fail'?`<div class="card bad"><b>알림을 보내지 못했어요</b><div style="font-size:13px;margin-top:2px">확정은 저장됐어요. 다시 누르면 알림만 다시 가요</div></div>`:'')
      +field('장소·시간','강남역 근처, 저녁 6시',{act:'f-place'})
      +field('구성원에게 한마디','18일 저녁에 봐요! 자세한 장소는 다시 알릴게요.',{act:'f-msg'})
      +`<div class="card soft"><div class="hint">이렇게 보내져요</div>[대학 동기] 10/18 (토) 저녁 6시 · 강남역 근처로 확정됐어요. — 수진</div>`
      +sec('back-adjust','재조율로 되돌리기');
    const cta=st==='loading'?loadBtn('알리는 중…'):pri('confirm-notify',st==='fail'?'다시 알리기':'확정하고 알리기',st==='pressed'?'pressed':'');
    return frame({left:back(),title:'모임 확정',body,cta});
  },
  /* ⑩ 확정됐어요 */
  done(v,st){
    const body=st==='loading'?skel():`<div class="spacer"></div><div style="text-align:center"><div class="ok-circle">✓</div><div class="big">확정됐어요</div><div class="hint" style="margin-top:6px">대학 동기 · 10/18 (토) 저녁 6시 · 강남역 근처<br>지현·은비에게 확정 링크를 다시 보냈어요</div></div>
      ${st==='fail'?`<div class="card bad"><b>은비에게 보내지 못했어요</b><div style="font-size:13px;margin-top:6px">확정은 됐어요. 링크만 다시 보내면 돼요</div>${sec('resend','다시 보내기').replace('btn sec','btn sec" style="margin-top:10px;height:44px;color:var(--ink)')}</div>`:''}
      <div class="spacer"></div>${sec('to-detail','모임 상세 보기')}`;
    return frame({left:close_(),title:'확정',body,cta:pri('go-home','홈으로')});
  },
  /* ⑪ 겹침 시트 */
  overlap(v,st){
    const inner=`<div class="sh-top"><span class="tt">10/12 (일) — 어느 모임을 옮길까요?</span>${close_()}</div>
      <div class="hint">같은 시간대에 모임이 둘이에요.</div>
      ${st==='loading'?skel():`<div class="card tight"><div class="row"><span class="nm"><b>박 팀장</b><span class="tag side">신랑측</span><small>오후 1시 · 1:1 · 확정</small></span>${sec('re-adjust','날짜 다시 조율','sm')}</div>
      <div class="row"><span class="nm"><b>동네 친구</b><span class="tag side">신부측</span><small>오후 1시 · 하늘·은비 외 2명 · 확정</small></span>${sec('re-adjust','날짜 다시 조율','sm')}</div></div>`}
      <div class="btn ghost" data-act="keep">그냥 둘게요</div>`;
    return SCR.home('oct12','default').replace(hind(),hind()+sheet(inner));
  },
  /* ⑯ 온보딩 */
  onboard(v,st){
    const empty=st==='empty',fail=st==='fail',ok=st==='success';
    let body;
    if(st==='loading')body=skel();
    else if(ok)body=`<div class="spacer"></div><div style="text-align:center"><div class="ok-circle">✓</div><div class="big">민준 님과 연결됐어요</div><div class="hint" style="margin-top:6px">이제 두 분의 모임이 한 달력에 모여요<br>결혼식 2026-11-21 (토) · D-77</div></div><div class="spacer"></div>`;
    else body=`<div class="big">반가워요. 먼저 두 분을 연결할게요.</div>`
      +field('내 이름','수진',{act:'f-name'})
      +`<div class="seg"><span class="on" data-act="seg">신부</span><span data-act="seg">신랑</span></div>`
      +field('결혼식 날짜','2026-11-21 (토)',{act:'f-date'})
      +`<div class="card soft"><div class="hint">내 초대 코드 — 상대에게 보내세요</div><div class="big" style="letter-spacing:4px;margin:4px 0 8px">SJ-4271</div>${sec('copy','코드 복사')}</div>
      <div class="hint" style="text-align:center">또는</div>`
      +field('상대 코드 입력',empty?'MJ-____':(fail?'MJ-1234':'MJ-8830'),{ph:empty,err:fail,act:'f-code'})
      +(fail?`<div class="err-t">코드를 다시 확인해 주세요 — 맞는 코드가 없어요</div>`:'')
      +`<div class="btn ghost" data-act="later">나중에 연결하기</div>`;
    const cta=st==='loading'?loadBtn('연결 중…'):ok?pri('start','시작하기'):pri('link',empty?'코드를 입력하면 연결할 수 있어요':'커플 연결 완료',empty?'dis':'');
    return frame({title:'시작하기',body,cta});
  },
  /* ⑰ 설정 */
  settings(v,st){
    const un=st==='empty';
    const body=st==='loading'?skel():`<div class="card tight"><div class="row" data-act="me"><span class="nm"><b>수진</b> · 신부<small>010-1234-0000</small></span><span class="rt">수정 ›</span></div>
      <div class="row" data-act="spouse"><span class="nm"><b>배우자 연결</b><small>${un?'아직 연결되지 않았어요':'민준과 연결됨 · 2026-09-01'}</small></span><span class="rt">${un?'초대 코드 입력 ›':'연결 해제 ›'}</span></div>
      <div class="row" data-act="wed"><span class="nm"><b>결혼식 날짜</b><small>2026-11-21 (토) · D-77</small></span><span class="rt">변경 ›</span></div></div>
      ${un?`<div class="card soft"><div class="t">두 분이 연결되면</div><div class="h">신랑측·신부측 모임이 한 달력에 모이고, 같은 날 겹침을 알려줘요</div></div>`:''}
      <div class="card tight"><div class="grp" style="cursor:default">알림</div>
        <div class="row" data-act="noti"><span class="nm">회신이 오면 알림</span><span class="sw on"></span></div>
        <div class="row" data-act="noti"><span class="nm">마감 하루 전 알림</span><span class="sw on"></span></div>
        <div class="row" data-act="noti"><span class="nm">같은 날 모임이 겹치면 알림</span><span class="sw on"></span></div></div>
      <div class="btn ghost" data-act="logout">로그아웃</div>`;
    return frame({title:'설정',body,cta:un?pri('link','초대 코드로 연결하기'):sec('edit-me','내 정보 수정'),tab:'set'});
  }
};

 states:['default','loading'],gaze:'위→아래: ① 제목 → ② 달력에서 점과 빨간 표시를 보고 → ③ 목록에서 시간을 확인하고 → 다른 날(12일)을 눌러 봅니다'},
{tab:2,num:'①',name:'홈 (10/12 겹침)',screen:'home',v:'oct12',hl:'[data-act="overlap-badge"]',
 sit:'10/12를 누르면 같은 시간대에 모임이 둘이라 빨간 "겹침" 배지가 붙어 있습니다. 배지를 누릅니다.',
 lay:[L_TOP,['.cal','달력 — 12일이 선택됨'],['.body .card.tight','목록 — 오후 1시 모임 둘, 빨간 "겹침" 배지'],L_CTA,L_TAB],
 res:['누름','"어느 모임을 옮길까요?" 시트가 올라옴'],fail:'실패하면: 없음',
 states:['default'],gaze:'위→아래: ① 제목 → ② 달력 12일 → ③ 목록의 빨간 배지가 눈에 걸리면 → 배지를 눌러 해결 방법을 봅니다'},
{tab:2,num:'⑪',name:'겹침 시트',screen:'overlap',v:'',hl:null,
 sit:'"어느 모임을 옮길까요?" 시트가 올라오고, 각 모임 옆에 "날짜 다시 조율" 버튼이 있습니다. 여기까지가 시나리오 3입니다.',
 lay:[['.sheet .sh-top','시트 제목 — 어느 날이 문제인지'],['.sheet .card','모임 2개 — 각각 "날짜 다시 조율" 버튼'],['.sheet .ghost','그냥 둘게요 — 아무것도 안 바꾸고 닫기']],
 res:null,fail:null,
 states:['default','loading'],gaze:'위→아래: ① 시트 제목 → ② 두 모임을 비교하고 옮길 쪽의 버튼을 → ③ 아니면 그냥 두고 닫습니다'},
/* ===== 부록 ===== */
{tab:3,num:'⑯',name:'온보딩·커플 연결',screen:'onboard',v:'',hl:null,
 sit:'플로우 밖 화면입니다. 처음 앱을 열면 이름·결혼식 날짜를 적고, 내 초대 코드를 보여주거나 상대 코드를 입력해 두 사람을 연결합니다. 누를 버튼 없이 자유롭게 보세요.',
 lay:[L_TOP,['.body','본문 — 이름·역할·결혼식 날짜, 내 코드, 상대 코드 칸'],L_CTA],
 res:null,fail:null,
 states:['default','empty','loading','success','fail'],gaze:'위→아래: ① 제목 → ② 위에서부터 칸을 채우고 코드를 주고받고 → ③ 하단 버튼으로 연결을 끝냅니다'},
{tab:3,num:'⑰',name:'설정',screen:'settings',v:'',hl:null,
 sit:'플로우 밖 화면입니다. 내 정보, 배우자 연결 상태, 결혼식 날짜, 알림을 관리합니다. 누를 버튼 없이 자유롭게 보세요.',
 lay:[L_TOP,['.body','본문 — 내 정보, 배우자 연결, 결혼식 날짜, 알림 스위치'],L_CTA,L_TAB],
 res:null,fail:null,
 states:['default','loading','empty'],gaze:'위→아래: ① 제목 → ② 줄을 훑어 바꿀 항목을 찾고 → ④ 탭바로 나갑니다'}
];
const TAB_NAMES=['1 지인 등록하고 모임 만들기','2 날짜 후보 보내고 회신 모으기','3 확정하고 겹침 확인','부록'];

/* ---------- 상태 ---------- */
let cur=0,state='default',arrowsOn=false;
const $=(s,r=document)=>r.querySelector(s);
const phone=$('#phone');

function goto(i,resetState=true){
  cur=Math.max(0,Math.min(SCENES.length-1,i));
  if(resetState)state='default';
  renderAll();
}
function renderAll(){
  const sc=SCENES[cur];
  /* tabs */
  $('#tabs').innerHTML=TAB_NAMES.map((t,i)=>`<button class="${i===sc.tab?'on':''}" data-tab="${i}">${t}</button>`).join('');
  /* progress */
  const inTab=SCENES.filter(s=>s.tab===sc.tab);
  const k=inTab.indexOf(sc);
  $('#cnt').textContent=`${k+1} / ${inTab.length}`;
  $('#dots').innerHTML=inTab.map((s,i)=>{const gi=SCENES.indexOf(s);return `<i class="${i===k?'on':(i<k?'done':'')}${FB[gi+1]?' fb':''}" data-go="${gi}" title="장면 ${gi+1}${FB[gi+1]?' · 의견 있음':''}"></i>`}).join('');
  $('#prev').disabled=cur===0;$('#next').disabled=cur===SCENES.length-1;
  $('#stitle').innerHTML=`${cur+1} · 화면 ${sc.num} ${sc.name}${sc.who?`<small>${sc.who}</small>`:''}`;
  /* panel */
  $('#p-sit').innerHTML=(sc.who?`<span class="who">${sc.who}</span>`:'')+sc.sit;
  $('#p-lay').innerHTML=sc.lay.map((l,i)=>`<li><b>${i+1}</b><span>${l[1].replace(/^([^—]+) — /,'<em>$1</em> — ')}</span></li>`).join('');
  if(sc.res){
    $('#p-res').innerHTML=`<div class="chain">${sc.res.map((c,i)=>`${i?'<span class="ar">→</span>':''}<span class="c ${i===0?'first':(i===sc.res.length-1?'ok':'')}">${c}</span>`).join('')}</div>`
      +(sc.fail?`<div class="chain fail"><span class="c">${sc.fail}</span></div>`:'');
  }else{
    $('#p-res').innerHTML=`<p class="none">이 장면에서는 누를 버튼이 없어요. 위의 <b>다음 ›</b> 버튼(또는 키보드 →)으로 넘어가세요.</p>`;
  }
  $('#segs').innerHTML=Object.keys(ST).map(k=>{const has=sc.states.includes(k);return `<button data-st="${k}" class="${k===state?'on':''}" ${has?'':'disabled title="이 화면엔 없어요"'}>${ST[k]}${has?'':' · 없어요'}</button>`}).join('');
  $('#segnote').textContent=ST_NOTE[state]||'';
  $('#p-gaze').textContent='위→아래: '+sc.lay.map((l,i)=>CIRC[i]+' '+regionName(sc,i)).join(' → ');
  renderPhone();
  renderFb();
}
function renderPhone(){
  const sc=SCENES[cur];
  phone.innerHTML=SCR[sc.screen](sc.v,state)+`<svg class="arrows${arrowsOn?' on':''}" width="390" height="844" viewBox="0 0 390 844"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6BFF"/></marker></defs><g id="arrow-g"></g></svg>`;
  /* labels */
  sc.lay.forEach((l,i)=>{
    const el=phone.querySelector(l[0]);if(!el)return;
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    const b=document.createElement('span');b.className='lab';b.textContent=i+1;
    if(el.classList.contains('body'))b.style.cssText='top:4px;left:4px';
    el.appendChild(b);
  });
  /* highlight + bubble */
  phone.parentElement.querySelectorAll('.bub').forEach(x=>x.remove());
  if(sc.hl&&(state==='default'||state==='pressed')){
    const t=phone.querySelector(sc.hl);
    if(t){t.classList.add('hl');
      const b=document.createElement('div');b.className='bub';b.textContent='여기 클릭 →';
      const col=phone.parentElement;col.appendChild(b);
      const place=()=>{
        const pr=phone.getBoundingClientRect(),r=t.getBoundingClientRect();
        const top=r.top-pr.top;
        b.style.top=(top+r.height/2)+'px';
        b.style.display=(top< -10||top>844)?'none':'';
      };
      place();phone.querySelector('.body').addEventListener('scroll',()=>{place();drawArrows();});
    }
  }
  drawArrows();
}
function drawArrows(){
  const g=phone.querySelector('#arrow-g');if(!g)return;
  const pr=phone.getBoundingClientRect();
  const pts=[...phone.querySelectorAll('.lab')].map(l=>{const r=l.getBoundingClientRect();return [r.left-pr.left+12,r.top-pr.top+12]});
  let h='';
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
    const sx=x1+dx/len*18,sy=y1+dy/len*18,ex=x2-dx/len*18,ey=y2-dy/len*18;
    const cx=(sx+ex)/2+(Math.abs(dy)>Math.abs(dx)?70:0),cy=(sy+ey)/2;
    h+=`<path d="M${sx} ${sy} Q${cx} ${cy} ${ex} ${ey}" fill="none" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="7 6" opacity=".75" marker-end="url(#ah)"/>`;
  }
  g.innerHTML=h;
}
/* ---------- 토스트 ---------- */
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

/* ---------- 이벤트 ---------- */
phone.addEventListener('click',e=>{
  const sc=SCENES[cur];
  const act=e.target.closest('[data-act]');
  if(sc.hl&&act&&act.matches(sc.hl)&&(state==='default'||state==='pressed')){
    if(cur<SCENES.length-1)goto(cur+1);
    return;
  }
  if(act||e.target.closest('.btn,.row,.chip,.day,.seg span,.tab,.grp,.field,.ib'))toast('이 투어에서는 안 쓰는 버튼이에요');
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)goto(SCENES.findIndex(s=>s.tab===+b.dataset.tab));});
$('#dots').addEventListener('click',e=>{const d=e.target.closest('[data-go]');if(d)goto(+d.dataset.go);});
$('#prev').addEventListener('click',()=>goto(cur-1));
$('#next').addEventListener('click',()=>goto(cur+1));
$('#segs').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b||b.disabled)return;state=b.dataset.st;renderAll();});
$('#tg').addEventListener('click',()=>{arrowsOn=!arrowsOn;$('#tg').classList.toggle('on',arrowsOn);const s=phone.querySelector('.arrows');if(s)s.classList.toggle('on',arrowsOn);});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();goto(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();goto(cur-1);}
});
window.addEventListener('resize',drawArrows);

/* ---------- 의견 남기기 (Artifact db, 없으면 localStorage) ---------- */
const FB={};            /* 장면 번호(1부터) → 저장된 문서 */
let OVERALL=null;
const DRAFT={};         /* 장면 번호 → 아직 저장 안 한 입력 */
let db=null,dbReady=false;
const LS_KEY='flow-tour-feedback';
const CIRC=['①','②','③','④','⑤'];
const regionName=(sc,i)=>sc.lay[i][1].split(' — ')[0];

function fmtAgo(iso){
  if(!iso)return '';
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  return new Date(iso).toLocaleDateString('ko-KR');
}
function updateCount(){$('#fb-count').textContent=`의견 남긴 장면 ${Object.keys(FB).length}개`;}
function draft(n){
  const sc=SCENES[n-1];
  if(!DRAFT[n]){const s=FB[n];DRAFT[n]={reaction:s?s.reaction:null,marks:s?[...(s.marks||[])]:[],text:s?s.text||'':''};}
  return DRAFT[n];
}
function renderFb(){
  const n=cur+1,sc=SCENES[cur],d=draft(n);
  $('#react').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===d.reaction));
  const more=d.reaction==='confusing';
  $('#fb-more').hidden=!more;
  $('#marks').innerHTML=sc.lay.map((l,i)=>`<button data-m="${CIRC[i]}" class="${d.marks.includes(CIRC[i])?'on':''}"><b>${i+1}</b>${CIRC[i]} ${regionName(sc,i)}</button>`).join('');
  $('#fb-text').value=d.text;
  $('#fb-saved').textContent=FB[n]?`저장됨 ✓ ${fmtAgo(FB[n].updatedAt)}`:'';
  /* 왼쪽 띠: 🤔면 저장 버튼, 👍(저장됨)면 "저장됨 ✓" 텍스트, 아직 안 골랐으면 둘 다 숨김 */
  $('#fb-save').hidden=!more;
  $('#side-saved').hidden=!(d.reaction==='good'&&FB[n]&&FB[n].reaction==='good');
}
async function saveScene(n,d){
  const sc=SCENES[n-1];
  const doc={scene:n,screen:`${sc.num} ${sc.name}`,reaction:d.reaction,marks:[...d.marks],
    markNames:d.marks.map(m=>regionName(sc,CIRC.indexOf(m))),text:d.text.trim(),updatedAt:new Date().toISOString()};
  await persist(`feedback/scene-${n}`,doc);FB[n]=doc;delete DRAFT[n];updateCount();
}
$('#react').addEventListener('click',async e=>{
  const b=e.target.closest('[data-r]');if(!b)return;
  const n=cur+1,d=draft(n);d.reaction=b.dataset.r;
  if(d.reaction==='good'){
    d.marks=[];d.text='';
    try{await saveScene(n,d);renderAll();toast('저장됨 ✓');}
    catch(err){console.warn('feedback save failed',err&&err.code,err);toast(err&&err.code==='not_granted'?'저장 권한이 없어요 — 페이지를 다시 열어 주세요':'저장 실패, 다시 눌러 주세요');renderFb();}
  }else renderFb();
});
$('#marks').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const d=draft(cur+1),m=b.dataset.m;const i=d.marks.indexOf(m);i<0?d.marks.push(m):d.marks.splice(i,1);d.marks.sort();renderFb();});
$('#fb-text').addEventListener('input',e=>{draft(cur+1).text=e.target.value;});

async function persist(path,doc){
  if(dbReady&&db){await db.doc(path).set(doc);}
  else{
    let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){}
    all[path]=doc;try{localStorage.setItem(LS_KEY,JSON.stringify(all));}catch(_){throw {code:'unavailable',message:'localStorage 실패'};}
  }
}
$('#fb-save').addEventListener('click',async()=>{
  const n=cur+1,d=draft(n),btn=$('#fb-save');
  btn.disabled=true;btn.textContent='저장 중…';
  try{await saveScene(n,d);renderAll();toast('저장됨 ✓');}
  catch(e){console.warn('feedback save failed',e&&e.code,e);toast(e&&e.code==='not_granted'?'저장 권한이 없어요 — 페이지를 다시 열어 주세요':'저장 실패, 다시 눌러 주세요');}
  finally{btn.disabled=false;btn.textContent='저장';}
});
$('#ov-save').addEventListener('click',async()=>{
  const btn=$('#ov-save');
  const doc={scene:0,screen:'전체',reaction:null,marks:[],markNames:[],text:$('#ov-text').value.trim(),updatedAt:new Date().toISOString()};
  btn.disabled=true;btn.textContent='저장 중…';
  try{await persist('feedback/overall',doc);OVERALL=doc;$('#ov-saved').textContent=`저장됨 ✓ ${fmtAgo(doc.updatedAt)}`;toast('저장됨 ✓');}
  catch(e){console.warn('overall save failed',e&&e.code,e);toast('저장 실패, 다시 눌러 주세요');}
  finally{btn.disabled=false;btn.textContent='저장';}
});
function applyLoaded(pairs){
  pairs.forEach(([id,data])=>{
    if(!data)return;
    if(id==='overall'){OVERALL=data;$('#ov-text').value=data.text||'';$('#ov-saved').textContent=`저장됨 ✓ ${fmtAgo(data.updatedAt)}`;}
    else{const m=/^scene-(\d+)$/.exec(id);if(m)FB[+m[1]]=data;}
  });
  updateCount();renderAll();
}
async function initFeedback(){
  try{
    db=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;
  }catch(e){db=null;}
  if(db){
    dbReady=true;
    try{
      const snap=await db.collection('feedback').get();
      applyLoaded(snap.docs.map(d=>[d.id,d.data()]));
    }catch(e){console.warn('feedback load failed',e&&e.code,e);toast('저장된 의견을 불러오지 못했어요');}
  }else{
    $('#fb-warn').hidden=false;
    let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){}
    applyLoaded(Object.entries(all).map(([p,d])=>[p.replace(/^feedback\//,''),d]));
  }
}
goto(0);
initFeedback();
</script>
