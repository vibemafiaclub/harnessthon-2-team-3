<title>규칙 미리보기</title>
<style>
/* ===== 앱 토큰 — design/design-rules.md §A·§B·§C 값 그대로. 여기 외에 앱 값 하드코딩 없음 ===== */
:root{color-scheme:light only;
  /* A. 색 */
  --bg:#FDFBF7;--surface-1:#F5F0E8;--surface-2:#EDE6DA;--text:#1F1B16;--text-muted:#6B6560;--border:#E7E0D4;
  --accent:#EA580C;--accent-pressed:#C2410C;--accent-soft:#FDF0E7;--danger:#DC2626;--overlay:rgba(0,0,0,.5);
  --on-accent:#FFFFFF;
  /* C. 프로젝트 색 */
  --side-groom:#4F7BE0;--side-bride:#D95F8C;
  --chip-wait-bg:var(--surface-2);--chip-wait-fg:var(--text);
  --chip-soon-bg:var(--accent-soft);--chip-soon-fg:var(--accent);
  --chip-fixed-bg:#DCFCE7;--chip-fixed-fg:#166534;
  --chip-done-bg:var(--surface-2);--chip-done-fg:var(--text-muted);--done-opacity:.7;
  /* A. 간격 */
  --sp-4:4px;--sp-8:8px;--sp-12:12px;--sp-16:16px;--sp-24:24px;--sp-32:32px;--sp-48:48px;
  --screen-pad:16px;--section:24px;--card-pad:16px;
  /* A. 라운드·그림자 */
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
  --shadow-sm:0 1px 2px rgba(31,27,22,.06);--shadow-md:0 4px 12px rgba(31,27,22,.08);
  /* A. 글자 */
  --font:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --txt:1; /* 글자 확대 배율. ⑪에서 1.2 */
  --fs-display:calc(28px*var(--txt));--fw-display:700;
  --fs-h1:calc(24px*var(--txt));--fw-h1:600;
  --fs-h2:calc(18px*var(--txt));--fw-h2:600;
  --fs-h3:calc(17px*var(--txt));--fw-h3:600;
  --fs-body:calc(15px*var(--txt));--fw-body:400;
  --fs-body-sm:calc(14px*var(--txt));--fw-body-sm:400;
  --fs-caption:calc(12px*var(--txt));--fw-caption:400;
  --fs-label:calc(13px*var(--txt));--fw-label:500;
  --lh:1.5;--lh-head:1.3;
  /* A. z·모션·기기 */
  --z-sticky:100;--z-app-bar:200;--z-tab-bar:200;--z-overlay:300;--z-sheet:400;--z-dialog:500;--z-snackbar:600;
  --motion:200ms ease-out;--motion-sheet:250ms;--motion-state:150ms;
  --frame-w:390px;--frame-h:844px;--statusbar:44px;--home:34px;--tap:44px;--tap-gap:8px;
  /* B. 버튼 */
  --btn-sm-h:36px;--btn-sm-px:12px;--btn-sm-fs:calc(14px*var(--txt));
  --btn-md-h:44px;--btn-md-px:16px;--btn-md-fs:calc(15px*var(--txt));
  --btn-lg-h:52px;--btn-lg-px:20px;--btn-lg-fs:calc(16px*var(--txt));
  --btn-radius:var(--r-md);--disabled-opacity:.4;--spinner:20px;
  /* B. 아이콘 */
  --icon-16:16px;--icon-20:20px;--icon-24:24px;--stroke-16:1.5;--stroke-20:1.75;--stroke-24:2;--icon-gap:8px;--icon-empty:48px;
  /* B. 아바타 */
  --avatar:32px;
  /* B. 레이아웃·고정 요소 */
  --appbar:56px;--cta-h:52px;--cta-pad:8px;--tabbar:49px;--row-h:56px;--snackbar-h:48px;--snackbar-gap:16px;--dialog-inset:48px;--grab-w:36px;--grab-h:4px;--sheet-header:56px;
  /* C. 회신 표·달력 */
  --cell:44px;--cal-cell:52px;--cal-bar:4px;
  /* 표(레퍼런스 카드·회신 표) 라운드 = radius.lg */
  --card-radius:var(--r-lg);
}

/* ===== 페이지 크롬 (하네스 UI, 앱 아님) ===== */
:root{--pg-bg:#F7F8FA;--pg-card:#FFFFFF;--pg-line:#E5E7EB;--pg-ink:#1F2937;--pg-sub:#6B7280;--pg-soft:#EEF0F3;--pg-acc:#2F6BFF;--pg-ok:#166534}
html,body{background:var(--pg-bg)}
body{margin:0;color:var(--pg-ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 72px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--pg-sub);margin:0 0 24px}
.counter{display:inline-block;font-size:13px;font-weight:600;color:var(--pg-acc);background:#EEF3FF;border-radius:14px;padding:3px 12px;vertical-align:4px;margin-left:8px}
.fb-warn{font-size:12px;color:var(--pg-sub);background:var(--pg-soft);border-radius:8px;padding:6px 10px;margin-bottom:16px;display:inline-block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:var(--pg-ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

section[data-section]{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start;margin-bottom:56px}
.strip{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;width:132px}
.strip .ax{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.strip .ax b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pg-ink);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.strip .ax span{overflow:hidden;text-overflow:ellipsis}
.save{font:inherit;font-weight:700;font-size:14px;height:40px;width:132px;padding:0;border-radius:10px;border:0;background:var(--pg-acc);color:#fff;cursor:pointer}
.save.good{background:var(--pg-card);color:var(--pg-ink);border:1.5px solid var(--pg-line)}
.save.good.on{background:var(--pg-ok);border-color:var(--pg-ok);color:#fff}
.save:disabled{opacity:.5;cursor:default}
.save:focus-visible,.marks button:focus-visible,textarea:focus-visible{outline:2px solid var(--pg-acc);outline-offset:2px}
.strip .saved{font-size:12px;font-weight:600;color:var(--pg-ok);text-align:center;min-height:18px;line-height:1.3}
h2{font-size:18px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .lab{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pg-ink);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;align-self:center}
h2 .plain{display:block;width:100%;font-size:13px;font-weight:400;color:var(--pg-sub);margin-top:2px}
.note{font-size:12px;color:var(--pg-sub);background:var(--pg-soft);border-radius:8px;padding:6px 10px;display:inline-block;margin:0 0 12px}
.note b{color:var(--pg-ink)}
@media (max-width:900px){section[data-section]{grid-template-columns:1fr}.strip{position:static;flex-direction:row;width:auto;align-items:center;flex-wrap:wrap}.strip .saved{margin-left:auto}}

/* 부품 보드: 앱 배경색 위에 부품을 놓는 판 */
.board{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:var(--sp-24);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh);display:flex;flex-direction:column;gap:var(--sp-24);max-width:1218px}
.board.w390{width:390px;padding:0;overflow:hidden;gap:0}
.brow{display:flex;flex-wrap:wrap;gap:var(--sp-16);align-items:flex-start}
.brow.center{align-items:center}
.cap{font-family:var(--font);font-size:var(--fs-caption);color:var(--text-muted);margin:0 0 var(--sp-8)}
.cap.dk{color:var(--pg-sub);font-family:inherit}
.cell-cap{display:flex;flex-direction:column;gap:var(--sp-8);align-items:flex-start}
.cell-cap>.cap{margin:0}
.col{display:flex;flex-direction:column;gap:var(--sp-16)}
.boards{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}

/* ===== 글자 역할 ===== */
.t-display{font-size:var(--fs-display);font-weight:var(--fw-display);line-height:var(--lh-head)}
.t-h1{font-size:var(--fs-h1);font-weight:var(--fw-h1);line-height:var(--lh-head)}
.t-h2{font-size:var(--fs-h2);font-weight:var(--fw-h2);line-height:var(--lh-head)}
.t-h3{font-size:var(--fs-h3);font-weight:var(--fw-h3);line-height:var(--lh-head)}
.t-body{font-size:var(--fs-body);font-weight:var(--fw-body);line-height:var(--lh)}
.t-body-sm{font-size:var(--fs-body-sm);font-weight:var(--fw-body-sm);line-height:var(--lh)}
.t-caption{font-size:var(--fs-caption);font-weight:var(--fw-caption);line-height:var(--lh)}
.t-label{font-size:var(--fs-label);font-weight:var(--fw-label);line-height:var(--lh)}
.muted{color:var(--text-muted)}
.type-table{width:100%;border-collapse:collapse;font-family:var(--font)}
.type-table td{padding:var(--sp-12) var(--sp-8);border-bottom:1px solid var(--border);vertical-align:middle}
.type-table td:first-child{width:130px;font-size:var(--fs-caption);color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.type-table td:last-child{width:170px;font-size:var(--fs-caption);color:var(--text-muted);text-align:right}

/* ===== 색 스와치 ===== */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-12)}
.sw{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.sw i{display:block;height:64px}
.sw .n{padding:var(--sp-8) var(--sp-12) 2px;font-size:var(--fs-label);font-weight:600}
.sw .v{padding:0 var(--sp-12) var(--sp-8);font-size:var(--fs-caption);color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sw .w{padding:0 var(--sp-12) var(--sp-8);font-size:var(--fs-caption);color:var(--text-muted)}

/* ===== 아이콘 ===== */
.ic{display:inline-block;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.s16{width:var(--icon-16);height:var(--icon-16);stroke-width:var(--stroke-16)}
.ic.s20{width:var(--icon-20);height:var(--icon-20);stroke-width:var(--stroke-20)}
.ic.s24{width:var(--icon-24);height:var(--icon-24);stroke-width:var(--stroke-24)}
.ic.s48{width:var(--icon-empty);height:var(--icon-empty);stroke-width:var(--stroke-24)}
.with-icon{display:inline-flex;align-items:center;gap:var(--icon-gap)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--sp-8)}
.icon-cell{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-8) var(--sp-12);background:var(--surface-1);border-radius:var(--r-md);min-height:48px}
.icon-cell .m{display:flex;flex-direction:column;min-width:0}
.icon-cell .m b{font-size:var(--fs-label);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-cell .m span{font-size:var(--fs-caption);color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.icon-cell .box{width:var(--icon-24);display:flex;justify-content:center;flex:none}
.igroup>.cap{margin-bottom:var(--sp-8)}
.ibtn{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--btn-radius);color:var(--text);position:relative;background:transparent}
.ibtn.hit{outline:1px dashed var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.ibtn.pressed{background:var(--surface-2)}

/* ===== 버튼 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--icon-gap);border-radius:var(--btn-radius);font-family:var(--font);font-weight:600;white-space:nowrap;border:1px solid transparent;position:relative;transition:background var(--motion-state);cursor:default;box-sizing:border-box}
.btn.sm{height:var(--btn-sm-h);padding:0 var(--btn-sm-px);font-size:var(--btn-sm-fs)}
.btn.md{height:var(--btn-md-h);padding:0 var(--btn-md-px);font-size:var(--btn-md-fs)}
.btn.lg{height:var(--btn-lg-h);padding:0 var(--btn-lg-px);font-size:var(--btn-lg-fs)}
.btn.full{width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary.pressed{background:var(--accent-pressed)}
.btn.secondary{background:var(--surface-1);color:var(--text)}
.btn.secondary.pressed{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost.pressed{background:var(--accent-soft)}
.btn.danger{background:var(--danger);color:var(--on-accent)}
.btn.danger.pressed{filter:brightness(.88)}
.btn.selected{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.disabled{opacity:var(--disabled-opacity)}
.btn.loading>span{visibility:hidden}
.btn.loading::after{content:"";position:absolute;width:var(--spinner);height:var(--spinner);border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn .hitbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100%,var(--tap));height:var(--tap);border:1px dashed rgba(249,115,22,.5);border-radius:var(--r-sm);pointer-events:none}
.btn-matrix{display:grid;grid-template-columns:120px repeat(5,minmax(0,auto));gap:var(--sp-12) var(--sp-16);align-items:center;font-family:var(--font)}
.btn-matrix .hd{font-size:var(--fs-caption);color:var(--text-muted)}
.btn-matrix .rl{font-size:var(--fs-label);font-weight:600}
.btn-matrix .rl small{display:block;font-weight:400;color:var(--text-muted);font-size:var(--fs-caption)}
.btn-row{display:flex;gap:var(--sp-8)}
.btn-row>.btn{flex:1}
.toggle-pair{display:flex;gap:var(--sp-8)}
.toggle-pair .btn{flex:1}

/* ===== 아바타 ===== */
.avatar{width:var(--avatar);height:var(--avatar);border-radius:var(--r-full);background:var(--surface-2);color:var(--text);font-size:var(--fs-label);font-weight:var(--fw-label);display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-family:var(--font)}
.avatar.photo{background:linear-gradient(135deg,var(--side-bride),var(--side-groom));color:var(--on-accent)}
.avatar.skel{color:transparent}
.avatar.groom{box-shadow:inset 0 0 0 2px var(--side-groom)}
.avatar.bride{box-shadow:inset 0 0 0 2px var(--side-bride)}
.stack{display:inline-flex;align-items:center}
.stack .avatar{border:2px solid var(--bg);margin-left:-10px}
.stack .avatar:first-child{margin-left:0}
.stack .avatar.more{background:var(--surface-1);color:var(--text-muted);font-size:var(--fs-caption)}

/* ===== 칩 ===== */
.chip{display:inline-flex;align-items:center;gap:var(--sp-4);height:24px;padding:0 var(--sp-8);border-radius:var(--r-full);font-size:var(--fs-caption);font-weight:600;white-space:nowrap;font-family:var(--font)}
.chip.wait{background:var(--chip-wait-bg);color:var(--chip-wait-fg)}
.chip.soon{background:var(--chip-soon-bg);color:var(--chip-soon-fg)}
.chip.fixed{background:var(--chip-fixed-bg);color:var(--chip-fixed-fg)}
.chip.done{background:var(--chip-done-bg);color:var(--chip-done-fg)}
.chip.side{background:var(--bg);border:1px solid var(--border);color:var(--text-muted)}
.chip.side i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.side.g i{background:var(--side-groom)}.chip.side.b i{background:var(--side-bride)}
.chip.member{background:var(--surface-2);color:var(--text-muted)}
.chip.conflict{background:var(--danger);color:var(--on-accent);height:20px;padding:0 6px}

/* ===== 카드 ===== */
.card{background:var(--surface-1);border-radius:var(--card-radius);padding:var(--card-pad);box-shadow:var(--shadow-sm);font-family:var(--font);width:358px;max-width:100%}
.card.done{opacity:var(--done-opacity)}
.card .top{display:flex;align-items:center;gap:var(--sp-8)}
.card .name{font-size:var(--fs-h3);font-weight:var(--fw-h3);line-height:var(--lh-head);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;align-items:center;gap:var(--sp-12);margin-top:var(--sp-8);font-size:var(--fs-body-sm);color:var(--text-muted);flex-wrap:wrap}
.card .meta .with-icon{gap:var(--sp-4)}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:var(--sp-12)}
.card .arrow{color:var(--text-muted)}
.card.reco{background:var(--accent-soft);border:1px solid var(--accent);box-shadow:none}
.card.reco .t{font-size:var(--fs-h3);font-weight:var(--fw-h3)}
.card.reco .h{font-size:var(--fs-body-sm);color:var(--text-muted);margin-top:var(--sp-4)}
.card.error{background:var(--surface-1);border:1px solid var(--danger)}
.card.error .t{display:flex;align-items:center;gap:var(--sp-8);color:var(--danger);font-size:var(--fs-body);font-weight:600}
.card.error .h{font-size:var(--fs-body-sm);color:var(--text-muted);margin:var(--sp-4) 0 var(--sp-12)}
.card.warn{background:var(--bg);border:1px solid var(--danger);box-shadow:none}
.card.warn .t{display:flex;align-items:center;gap:var(--sp-8);color:var(--danger);font-size:var(--fs-body);font-weight:600}
.card.warn .h{font-size:var(--fs-body-sm);color:var(--text-muted);margin-top:var(--sp-4)}

/* ===== 입력 ===== */
.field{display:flex;flex-direction:column;gap:var(--sp-4);width:358px;max-width:100%;font-family:var(--font)}
.field label{font-size:var(--fs-label);font-weight:var(--fw-label)}
.input{height:var(--btn-md-h);padding:0 var(--sp-12);border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);font-size:var(--fs-body);display:flex;align-items:center;gap:var(--icon-gap);color:var(--text);font-family:var(--font)}
.input .ph{color:var(--text-muted)}
.input.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.input.err{border-color:var(--danger)}
.input.select{justify-content:space-between}
.input .caret{display:inline-flex;width:1px;height:calc(var(--fs-body)*1.3);background:var(--accent);margin-left:0}
.field .help{font-size:var(--fs-caption);color:var(--text-muted)}
.field .help.err{color:var(--danger);display:flex;align-items:center;gap:var(--sp-4)}
.field .help.err .action{color:var(--accent);font-weight:600;margin-left:var(--sp-4)}
.switch-row{display:flex;align-items:center;justify-content:space-between;height:var(--row-h);padding:0 var(--sp-12);background:var(--surface-1);border-radius:var(--r-md);font-size:var(--fs-body);width:358px;max-width:100%;font-family:var(--font)}
.switch{width:44px;height:26px;border-radius:var(--r-full);background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow-sm);transition:left var(--motion-state)}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.gchips{display:flex;flex-wrap:wrap;gap:var(--sp-8)}
.gchip{height:32px;padding:0 var(--sp-12);border-radius:var(--r-full);border:1px solid var(--border);background:var(--bg);font-size:var(--fs-body-sm);display:inline-flex;align-items:center;font-family:var(--font)}
.gchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ===== 폰 프레임 ===== */
.phone{width:390px;height:844px}
.phone{position:relative;flex:none;overflow:hidden;display:flex;flex-direction:column;user-select:none;border-radius:36px;border:1px solid var(--border);background:var(--bg);color:var(--text);box-shadow:0 14px 40px rgba(31,27,22,.10);font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh)}
.phone.w360{width:360px}.phone.w430{width:430px}
.phone.big{--txt:1.2}
.sb{height:var(--statusbar);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:13px;font-weight:600;background:var(--bg)}
.sb .r{letter-spacing:1px;font-size:11px;color:var(--text-muted)}
.appbar{height:var(--appbar);flex:none;display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center;padding:0 var(--sp-8);border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:var(--z-app-bar)}

<script>
/* ---------- 도우미 ---------- */

const ic=(name,size)=>`<svg class="ic s${size||20}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

/* design/icons.md 허용 목록 42행, 그룹은 허브 "아이콘" 탭과 동일 */
const ICON_GROUPS=[
 {name:'탭바',items:[['탭 홈','calendar-days',24],['탭 모임','users',24],['탭 지인풀','contact',24],['탭 설정','settings',24]]},
 {name:'앱바·내비',items:[['뒤로','chevron-left',24],['닫기','x',24],['더보기','ellipsis-vertical',24],['검색','search',20],['접기/펼치기','chevron-down',20],['다음(행 이동)','chevron-right',20],['월 이동','chevron-left / chevron-right',20]]},
 {name:'모임·회신',items:[['새로 만들기','plus',20],['날짜 후보','calendar-plus',20],['회신 마감','hourglass',16],['회신 가능','check',20],['회신 불가능','x',20],['아직 답 없음','circle-dashed',20],['다시 알림','bell-ring',16],['다녀옴','check-check',16],['모임 취소','trash-2',20],['재조율','rotate-ccw',20],['시간','clock',16],['장소','map-pin',20]]},
 {name:'공유·확정',items:[['공유','share-2',20],['카카오톡으로 보내기','message-circle',20],['링크 복사','link',20],['문자로 보내기','message-square',20],['확정','check-circle-2',20],['초대 코드 복사','copy',20]]},
 {name:'지인·설정',items:[['연락처에서 가져오기','book-user',20],['1:1로 따로','user',16],['중복 소속','layers',16],['배우자 참석','heart',20],['커플 연결됨','link-2',20],['연결 해제','unlink-2',20],['알림 설정','bell',20],['로그아웃','log-out',20]]},
 {name:'상태·오류',items:[['겹침 경고','triangle-alert',16],['오류','circle-alert',20],['빈 상태','inbox',48],['오프라인','wifi-off',16],['브라우저(게스트)','globe',16]]}
];
const ICON_COUNT=ICON_GROUPS.reduce((a,g)=>a+g.items.length,0);

/* 색 스와치 (값은 CSS 변수에서 읽어 표시) */
const SWATCHES=[
 ['bg','--bg','화면 바탕'],['surface-1','--surface-1','카드·패널'],['surface-2','--surface-2','칩·표 머리'],
 ['text','--text','글자'],['text-muted','--text-muted','보조 글자'],['border','--border','선'],
 ['accent','--accent','눌러야 할 버튼'],['accent-pressed','--accent-pressed','버튼 누르는 동안'],['accent-soft','--accent-soft','선택됨·추천 배경'],
 ['danger','--danger','겹침·오류'],['side-groom','--side-groom','신랑측 색 바'],['side-bride','--side-bride','신부측 색 바']
];

/* ---------- 부품 조각 ---------- */
function avatar(init,cls){return `<span class="avatar ${cls||''}">${init}</span>`;}
function stack(list,more){return `<span class="stack">${list.map(([i,c])=>avatar(i,c)).join('')}${more?avatar('+'+more,'more'):''}</span>`;}
function chip(kind){
  const m={wait:['회신 대기',''],soon:['확정 임박',ic('hourglass',16)],fixed:['확정',ic('check-circle-2',16)],done:['다녀옴',ic('check-check',16)]}[kind];
  return `<span class="chip ${kind}">${m[1]}${m[0]}</span>`;
}
function meetingCard({name,side,status,time,place,members,more,done}){
  return `<div class="card ${done?'done':''}">
    <div class="top"><div class="name">${esc(name)}</div>${chip(status)}</div>
    <div class="meta"><span class="with-icon">${ic('clock',16)}${esc(time)}</span>${place?`<span class="with-icon">${ic('map-pin',16)}${esc(place)}</span>`:''}<span class="chip side ${side==='g'?'g':'b'}"><i></i>${side==='g'?'신랑측':'신부측'}</span></div>
    <div class="foot">${stack(members,more)}<span class="arrow">${ic('chevron-right',20)}</span></div>
  </div>`;
}
function replyCell(kind){
  if(kind==='ok')return `<span class="rc ok"><i>${ic('check',20)}</i></span>`;
  if(kind==='no')return `<span class="rc no"><i>${ic('x',20)}</i></span>`;
  if(kind==='skel')return `<span class="rc skel"><i></i></span>`;
  return `<span class="rc none"><i>${ic('circle-dashed',20)}</i></span>`;
}
function replyTable(opts){
  const o=opts||{};
  const row=(nm,cells,extra,hi)=>`<tr${hi?' class="hi"':''}><td class="nm"><span class="name-cell">${avatar(nm[0])}<span>${esc(nm)}</span></span></td>${cells.map(replyCell).join('')}${extra}</tr>`;
  return `<table class="mx">
    <tr><th>구성원</th><th>10/11 토</th><th>10/12 일</th><th>10/18 토</th><th></th></tr>
    ${row('지현',o.skel?['skel','skel','skel']:['ok','no','ok'],'<td></td>')}
    ${row('태호',o.skel?['skel','skel','skel']:['none','none','none'],`<td class="ac"><span class="btn ghost sm">${ic('bell-ring',16)}다시 알림</span></td>`)}
    ${row('은비',o.skel?['skel','skel','skel']:['no','ok','ok'],'<td></td>')}
  </table>`;
}
function calendar(){
  const dows=['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  const cells=[];
  for(let i=0;i<4;i++)cells.push('<div class="d"></div>');
  for(let d=1;d<=31;d++){
    let cls='d',inner='';
    if(d<5)cls+=' past';
    if(d===5)cls+=' today';
    if(d===11)inner='<div class="bars"><div class="bar b"></div></div>';
    if(d===12)inner='<div class="bars"><div class="bar g"></div><div class="bar b"></div></div><span class="chip conflict">겹침</span>';
    if(d===18)inner='<div class="bars"><div class="bar g"></div><div class="bar b"></div></div>';
    if(d===25)inner='<div class="bars"><div class="bar both"></div></div>';
    cells.push(`<div class="${cls}"><span class="n">${d}</span>${inner}</div>`);
  }
  return `<div class="cal"><div class="head"><span class="ibtn">${ic('chevron-left',20)}</span><span>2026년 10월</span><span class="ibtn">${ic('chevron-right',20)}</span></div>${dows}${cells.join('')}</div>`;
}
function appbar(title,right){return `<div class="appbar"><span class="ibtn" aria-label="뒤로">${ic('chevron-left',24)}</span><div class="tt">${esc(title)}</div>${right?`<span class="ibtn" aria-label="더보기">${ic('ellipsis-vertical',24)}</span>`:'<span></span>'}</div>`;}
function tabbar(active){
  const tabs=[['홈','calendar-days'],['모임','users'],['지인풀','contact'],['설정','settings']];
  return `<div class="tabbar">${tabs.map(([l,n],i)=>`<div class="tab ${i===active?'on':''}">${ic(n,24)}<span>${l}</span></div>`).join('')}</div>`;
}
const sbHTML=`<div class="sb"><span>9:41</span><span class="r">●●● ▮</span></div>`;
const hindHTML=`<div class="hind"><i></i></div>`;

/* 대표 화면 ⑧ 회신 현황 — ⑪ 기기 폭 비교용 */

      <div class="card reco" style="width:auto"><div class="t">답한 2명 모두 가능한 날: 10/18 (토)</div><div class="h">지현·은비 가능 · 태호는 아직 답이 없어요</div></div>
    </div>
    <div class="col" style="gap:var(--sp-8)">
      ${replyTable()}
      <div class="btn-row"><span class="btn secondary md">구성원 수정</span><span class="btn secondary md">후보 추가</span><span class="btn secondary md">${ic('share-2',20)}공유</span></div>
    </div>
  </div>
  <div class="ctabar"><span class="btn primary lg full">10/18로 확정</span></div>${hindHTML}`;

 {n:5,c:'⑤',name:'아바타',why:'사진 썸네일은 없고 사람 아바타 32 원형만. 사진 없으면 이니셜',

/* ---------- 렌더 ---------- */
function sectionHTML(s){
  return `<section data-section="${s.n}">
    <div class="strip">
      <div class="ax"><b>${s.n}</b><span>${esc(s.name)}</span></div>
      <button class="save" data-save="${s.n}">저장</button>
      <div class="saved" id="saved-${s.n}"></div>
    </div>
    <div>
      <h2><span class="lab">${s.c}</span>${esc(s.name)}<span class="plain">${esc(s.why)}</span></h2>
      ${s.n===3?'<div class="note" id="contrast-note"></div>':''}
      ${s.html()}
      <div class="fb" data-fb="${s.n}">
        <div class="eyebrow">${s.c} 어색한 부품</div>
        <div class="marks">${s.parts.map(p=>`<button data-m="${esc(p)}">${esc(p)}</button>`).join('')}</div>
        <div class="fb-lb" style="margin-top:12px">이유</div>
        <textarea data-text placeholder="예: 주황 버튼이 너무 튀어요 / 표 글자가 작아요"></textarea>
      </div>
    </div>
  </section>`;
}
$('#sections').innerHTML=SECTIONS.map(sectionHTML).join('');

/* 스와치 값 표시 — CSS 변수에서 읽음 */
(()=>{const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-var]').forEach(el=>{el.textContent=cs.getPropertyValue(el.dataset.var).trim();});})();

/* 글자 대비 계산 (정보용): accent 위 흰 글자 */
(()=>{
  const cs=getComputedStyle(document.documentElement);
  const hex=cs.getPropertyValue('--accent').trim(),fg=cs.getPropertyValue('--on-accent').trim();
  const lum=h=>{const m=/^#([0-9a-f]{6})$/i.exec(h);if(!m)return null;const v=[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2];};
  const a=lum(hex),b=lum(fg);if(a==null||b==null)return;
  const r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
  const n=$('#contrast-note');if(n)n.innerHTML=`글자 대비: <b>${r.toFixed(1)}:1</b> (${hex} 위 흰 글자 — 큰 글자 기준 3:1 ${r>=3?'충족':'미달'}, 본문 기준 4.5:1 ${r>=4.5?'충족':'미달'})`;
})();

/* ---------- 의견 패널 ---------- */
const UNITS=SECTIONS.map(s=>String(s.n));
const LABELS={};SECTIONS.forEach(s=>LABELS[s.n]=s.name);
const LS_KEY='rules-preview-feedback';
let db=null,dbReady=false;
const FB={},DRAFT={};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function fmtAgo(iso){
  if(!iso)return '';
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  return new Date(iso).toLocaleDateString('ko-KR');
}
function updateCount(){const n=UNITS.filter(k=>FB[k]).length;$('#fb-count').textContent=`의견 남긴 항목 ${n}개`;}
function draft(id){
  if(!DRAFT[id]){const s=FB[id];DRAFT[id]={marks:s?[...(s.marks||[])]:[],text:s?s.text||'':''};}
  return DRAFT[id];
}
function render(id){
  const panel=$(`.fb[data-fb="${id}"]`),d=draft(id);
  panel.querySelectorAll('.marks button').forEach(b=>b.classList.toggle('on',d.marks.includes(b.dataset.m)));
  const ta=$('[data-text]',panel);if(document.activeElement!==ta)ta.value=d.text;
  const s=FB[id];
  $(`#saved-${id}`).textContent=s?`저장됨 ✓ ${s.reaction==='good'?'추천대로':(s.marks&&s.marks.length?s.marks.length+'개 표시':'')} ${fmtAgo(s.updatedAt)}`:'';
  const g=$(`[data-good="${id}"]`);if(g){g.classList.toggle('on',!!(s&&s.reaction==='good'));g.textContent=s&&s.reaction==='good'?'괜찮아요 ✓':'괜찮아요 👍';}
}
function renderAll(){UNITS.forEach(render);}
document.querySelectorAll('.fb').forEach(panel=>{
  const id=panel.dataset.fb;
  panel.addEventListener('click',e=>{
    const mb=e.target.closest('.marks button');
    if(mb){const d=draft(id),m=mb.dataset.m,i=d.marks.indexOf(m);i<0?d.marks.push(m):d.marks.splice(i,1);render(id);}
  });
  $('[data-text]',panel).addEventListener('input',e=>{draft(id).text=e.target.value;});
});
async function persist(path,doc){
  if(dbReady&&db){await db.doc(path).set(doc);}
  else{
    let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){}
    all[path]=doc;try{localStorage.setItem(LS_KEY,JSON.stringify(all));}catch(_){throw {code:'unavailable',message:'localStorage 실패'};}
  }
}
function buildDoc(id,reaction){
  const d=draft(id);
  const marks=reaction==='good'?[]:[...d.marks];
  return {unit:'section',n:+id,label:LABELS[id],reaction:reaction||null,marks,markNames:[...marks],text:reaction==='good'?'':d.text.trim(),updatedAt:new Date().toISOString()};
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='not_granted')return '저장 권한이 없어요 — 페이지를 다시 열어 주세요';
  if(c==='revoked')return '접근이 끊겼어요 — 페이지를 다시 열어 주세요';
  if(c==='quota_exceeded')return '저장 공간이 가득 찼어요';
  if(c==='resource_exhausted')return '잠시 뒤 다시 눌러 주세요';
  if(c==='invalid_argument')return '저장 내용에 문제가 있어요';
  return '저장 실패, 다시 눌러 주세요';
}
document.querySelectorAll('[data-save]').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    const id=btn.dataset.save,doc=buildDoc(id,null);
    btn.disabled=true;btn.textContent='저장 중…';
    try{await persist(`feedback/section-${id}`,doc);FB[id]=doc;delete DRAFT[id];updateCount();render(id);toast('저장됨 ✓');}
    catch(e){console.warn('feedback save failed',e&&e.code,e);toast(errMsg(e));}
    finally{btn.disabled=false;btn.textContent='저장';}
  });
});
document.querySelectorAll('[data-good]').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    const id=btn.dataset.good,doc=buildDoc(id,'good');
    btn.disabled=true;btn.textContent='저장 중…';
    try{await persist(`feedback/section-${id}`,doc);FB[id]=doc;delete DRAFT[id];updateCount();render(id);toast('저장됨 ✓ 괜찮아요');}
    catch(e){console.warn('good save failed',e&&e.code,e);toast(errMsg(e));btn.textContent='괜찮아요 👍';}
    finally{btn.disabled=false;}
  });
});
function applyLoaded(pairs){
  pairs.forEach(([docId,data])=>{
    if(!data)return;
    const m=/^section-(\d+)$/.exec(docId);if(m&&LABELS[m[1]])FB[m[1]]=data;
  });
  updateCount();renderAll();
}
async function initFeedback(){
  try{
    db=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;
  }catch(e){db=null;}
  if(db){
    dbReady=true;
    try{
      const snap=await db.collection('feedback').get();
      applyLoaded(snap.docs.map(d=>[d.id,d.data()]));
    }catch(e){console.warn('feedback load failed',e&&e.code,e);toast('저장된 의견을 불러오지 못했어요');}
  }else{
    $('#fb-warn').hidden=false;
    let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){}
    applyLoaded(Object.entries(all).map(([p,d])=>[p.replace(/^feedback\//,''),d]));
  }
}
renderAll();
initFeedback();

$('#all-rec').addEventListener('click',async()=>{
  const btn=$('#all-rec');btn.disabled=true;btn.textContent='저장 중…';
  let ok=0,fail=0;
  for(const id of UNITS){
    try{const doc=buildDoc(id,'good');await persist(`feedback/section-${id}`,doc);FB[id]=doc;delete DRAFT[id];render(id);ok++;}
    catch(e){fail++;console.warn('all-rec save failed',id,e&&e.code,e);}
  }
  updateCount();
  btn.disabled=false;btn.textContent=fail?'전체 추천대로 할게요':'추천대로 저장됨 ✓';
  toast(fail?`${ok}개 저장, ${fail}개 실패 — 다시 눌러 주세요`:'저장됨 ✓ 전체 추천대로');
});
</script>
