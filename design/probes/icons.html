<title>아이콘 고르기</title>
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--soft:#F7F8FA;--ink:#1F2937;--sub:#6B7280;--line:#E5E7EB;--acc:#2F6BFF;--acc-soft:#EAF0FF;--ok:#15803D;--ok-soft:#ECFDF3}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--sub);margin:0}
.count{font-size:13px;color:var(--sub);white-space:nowrap}
.count b{color:var(--ink)}
.stage{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}.band{position:static;flex-direction:row;flex-wrap:wrap}}
/* 왼쪽 세로 띠 */
.band{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.band .big{height:40px;width:100%;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;padding:0 6px;line-height:1.2}
.band .big:disabled{opacity:.5;cursor:default}
.band .stat{font-size:12px;color:var(--sub);line-height:1.4}
.band .stat b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.band .warn{font-size:11px;color:#B45309;background:#FFFBEB;border-radius:8px;padding:6px 8px}
.band nav{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.band nav a{font-size:12px;color:var(--sub);text-decoration:none;padding:4px 6px;border-radius:6px}
.band nav a:hover{background:var(--soft);color:var(--ink)}
/* 그룹 */
.group{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;position:relative}
.group h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 2px}
.group h2 small{font-weight:500;font-size:13px;color:var(--sub);margin-left:auto}
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;flex:none}
.group .sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
/* 카드 */
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;background:var(--card);display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s}
.card.changed{border-color:var(--acc);background:#FBFCFF}
.card .tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--acc);color:#fff;visibility:hidden}
.card.changed .tag{visibility:visible}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:72px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);font-size:11px;color:var(--sub);opacity:.55;transition:opacity .15s,border-color .15s}
.opt:hover{opacity:.85}
.opt.on{opacity:1;border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:700}
.opt .ic{color:var(--ink)}
.opt.on .ic{color:var(--acc)}
.opt span{white-space:nowrap;line-height:1}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.pair{display:inline-flex;align-items:center;gap:2px}
.card .name{font-weight:700;font-size:15px;line-height:1.3;padding-right:52px}
.card .where{font-size:12px;color:var(--sub);height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .lname{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;opacity:.8;height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 탭바 미리보기 */
.preview{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.preview .cap{font-size:12px;color:var(--sub)}
.phone{width:390px;height:844px}
.phone-mini{width:390px;max-width:100%;height:156px;border:1px solid var(--line);border-top:1px dashed var(--line);border-radius:0 0 36px 36px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(31,41,55,.08)}
.phone-mini .body{flex:1;padding:12px 20px;display:flex;flex-direction:column;gap:8px}
.phone-mini .row{height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;gap:8px;color:var(--ink)}
.phone-mini .row i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.phone-mini .row .t{color:var(--sub);margin-left:auto}
.tabbar{height:56px;flex:none;border-top:1px solid var(--line);display:flex;background:#fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);gap:3px}
.tab.on{color:var(--acc);font-weight:700}
.hind{height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.hind i{width:134px;height:5px;border-radius:3px;background:var(--ink)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div class="warn" id="warn" hidden>이 환경에서는 브라우저에만 저장돼요</div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const ICONS=[{"g": 1, "key": "탭 홈", "rec": "calendar-days", "alts": ["house", "calendar"], "where": "탭바 홈 (전체 일정 달력)", "size": 24}, {"g": 1, "key": "탭 모임", "rec": "users", "alts": ["users-round", "party-popper"], "where": "탭바 모임", "size": 24}, {"g": 1, "key": "탭 지인풀", "rec": "contact", "alts": ["book-user", "user-round"], "where": "탭바 지인풀", "size": 24}, {"g": 1, "key": "탭 설정", "rec": "settings", "alts": ["settings-2", "sliders-horizontal"], "where": "탭바 설정", "size": 24}, {"g": 2, "key": "뒤로", "rec": "chevron-left", "alts": ["arrow-left", "circle-arrow-left"], "where": "앱바 왼쪽 (③⑤⑥⑧⑨⑮)", "size": 24}, {"g": 2, "key": "닫기", "rec": "x", "alts": ["circle-x", "square-x"], "where": "시트 (④⑦⑪), 폼 닫기", "size": 24}, {"g": 2, "key": "더보기", "rec": "ellipsis-vertical", "alts": ["ellipsis", "menu"], "where": "모임 상세 앱바 오른쪽", "size": 24}, {"g": 2, "key": "검색", "rec": "search", "alts": ["zoom-in", "text-search"], "where": "지인 풀 검색 칸", "size": 20}, {"g": 2, "key": "접기/펼치기", "rec": "chevron-down", "alts": ["chevrons-up-down", "circle-chevron-down"], "where": "지인 풀·모임 생성의 그룹 헤더", "size": 20}, {"g": 2, "key": "다음(행 이동)", "rec": "chevron-right", "alts": ["arrow-right", "chevrons-right"], "where": "모임 카드·지인 행 오른쪽 끝", "size": 20}, {"g": 2, "key": "월 이동", "rec": "chevron-left / chevron-right", "alts": ["arrow-left / arrow-right", "circle-chevron-left / circle-chevron-right"], "where": "홈·후보 등록 달력", "size": 20}, {"g": 3, "key": "새로 만들기", "rec": "plus", "alts": ["circle-plus", "square-plus"], "where": "\"+ 새 모임\", \"+ 지인 추가\", \"+ 새 그룹\"", "size": 20}, {"g": 3, "key": "날짜 후보", "rec": "calendar-plus", "alts": ["calendar-check", "send"], "where": "\"날짜 후보 보내기\" 버튼, \"후보 추가\"", "size": 20}, {"g": 3, "key": "회신 마감", "rec": "hourglass", "alts": ["timer", "alarm-clock"], "where": "상태 띠 \"마감 1일 전\", 게스트 마감 안내", "size": 16}, {"g": 3, "key": "회신 가능", "rec": "check", "alts": ["thumbs-up", "circle-check-big"], "where": "회신 표 O, 게스트 \"가능\" 버튼", "size": 20}, {"g": 3, "key": "회신 불가능", "rec": "x", "alts": ["thumbs-down", "circle-x"], "where": "회신 표 X, 게스트 \"불가능\" 버튼", "size": 20}, {"g": 3, "key": "아직 답 없음", "rec": "circle-dashed", "alts": ["circle-help", "clock"], "where": "회신 표 미응답 칸", "size": 20}, {"g": 3, "key": "다시 알림", "rec": "bell-ring", "alts": ["send", "megaphone"], "where": "미응답자(태호) 옆 \"다시 알림\"", "size": 16}, {"g": 3, "key": "다녀옴", "rec": "check-check", "alts": ["flag", "party-popper"], "where": "완료 상태 칩", "size": 16}, {"g": 3, "key": "모임 취소", "rec": "trash-2", "alts": ["trash", "ban"], "where": "모임 상세 더보기 시트", "size": 20}, {"g": 3, "key": "재조율", "rec": "rotate-ccw", "alts": ["refresh-cw", "undo-2"], "where": "\"재조율로 되돌리기\", \"날짜 다시 조율\"", "size": 20}, {"g": 3, "key": "시간", "rec": "clock", "alts": ["clock-3", "alarm-clock"], "where": "모임 카드·당일 목록의 시간", "size": 16}, {"g": 3, "key": "장소", "rec": "map-pin", "alts": ["map", "map-pinned"], "where": "확정 입력의 장소 칸, 모임 카드", "size": 20}, {"g": 4, "key": "공유", "rec": "share-2", "alts": ["share", "send"], "where": "모임 상세 \"링크 공유\", 공유 시트", "size": 20}, {"g": 4, "key": "카카오톡으로 보내기", "rec": "message-circle", "alts": ["message-square-text", "message-circle-more"], "where": "공유 시트 첫 행", "size": 20}, {"g": 4, "key": "링크 복사", "rec": "link", "alts": ["link-2", "clipboard-copy"], "where": "공유 시트", "size": 20}, {"g": 4, "key": "문자로 보내기", "rec": "message-square", "alts": ["message-square-more", "smartphone"], "where": "공유 시트", "size": 20}, {"g": 4, "key": "확정", "rec": "check-circle-2", "alts": ["badge-check", "calendar-check"], "where": "\"확정\" 버튼, 상태 칩, 확정됐어요 화면", "size": 20}, {"g": 4, "key": "초대 코드 복사", "rec": "copy", "alts": ["clipboard-copy", "key-round"], "where": "온보딩·커플 연결", "size": 20}, {"g": 5, "key": "연락처에서 가져오기", "rec": "book-user", "alts": ["contact-round", "import"], "where": "지인 등록 폼", "size": 20}, {"g": 5, "key": "1:1로 따로", "rec": "user", "alts": ["user-round", "user-check"], "where": "박 팀장처럼 따로 만나는 지인 표시", "size": 16}, {"g": 5, "key": "중복 소속", "rec": "layers", "alts": ["copy", "users"], "where": "은비처럼 \"다른 모임에도 있음\" 배지", "size": 16}, {"g": 5, "key": "배우자 참석", "rec": "heart", "alts": ["heart-handshake", "sparkles"], "where": "\"민준도 같이 가요\" 스위치 옆", "size": 20}, {"g": 5, "key": "커플 연결됨", "rec": "link-2", "alts": ["link", "heart-handshake"], "where": "설정의 배우자 연결 행", "size": 20}, {"g": 5, "key": "연결 해제", "rec": "unlink-2", "alts": ["unlink", "link-2-off"], "where": "설정", "size": 20}, {"g": 5, "key": "알림 설정", "rec": "bell", "alts": ["bell-dot", "bell-ring"], "where": "설정", "size": 20}, {"g": 5, "key": "로그아웃", "rec": "log-out", "alts": ["door-open", "power"], "where": "설정", "size": 20}, {"g": 6, "key": "겹침 경고", "rec": "triangle-alert", "alts": ["octagon-alert", "circle-alert"], "where": "홈 달력 겹침 배지, 후보 등록 겹침 경고", "size": 16}, {"g": 6, "key": "오류", "rec": "circle-alert", "alts": ["octagon-x", "triangle-alert"], "where": "실패 문구 옆 (중복 연락처, 전송 실패)", "size": 20}, {"g": 6, "key": "빈 상태", "rec": "inbox", "alts": ["calendar-x", "folder-open"], "where": "빈 상태 (48, 장식)", "size": 48}, {"g": 6, "key": "오프라인", "rec": "wifi-off", "alts": ["cloud-off", "signal-zero"], "where": "오프라인 배너", "size": 16}, {"g": 6, "key": "브라우저(게스트)", "rec": "globe", "alts": ["external-link", "link"], "where": "게스트 페이지 주소창 띠", "size": 16}];
const GROUPS=[{"n": 1, "c": "①", "name": "탭바", "sub": "하단 탭 4개. 아래 미리보기에서 실제 크기로 확인하세요."}, {"n": 2, "c": "②", "name": "앱바·내비", "sub": "화면 위쪽과 행 끝에서 이동에 쓰는 것"}, {"n": 3, "c": "③", "name": "모임·회신", "sub": "모임을 만들고 날짜 후보를 보내고 답을 모으는 동안"}, {"n": 4, "c": "④", "name": "공유·확정", "sub": "링크를 보내고 날짜를 확정할 때"}, {"n": 5, "c": "⑤", "name": "지인·설정", "sub": "지인 풀과 설정 화면"}, {"n": 6, "c": "⑥", "name": "상태·오류", "sub": "경고·오류·빈 화면"}];
const TAB_KEYS=['탭 홈','탭 모임','탭 지인풀','탭 설정'];
const TAB_LABELS=['홈','모임','지인풀','설정'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 상태 */
const choices={};           /* 의미 → 선택된 lucide 이름 (저장 전에는 추천값) */
ICONS.forEach(it=>choices[it.key]=it.rec);
let SAVED=null;              /* 마지막으로 저장된 문서 */
let db=null,dbReady=false;
const LS_KEY='icons-feedback';
const DOC='feedback/icons';

function svg(name,cls){
  const parts=name.split(' / ');
  const out=parts.map(n=>`<svg class="ic ${cls||''}"><use href="#i-${n}"/></svg>`).join('');
  return parts.length>1?`<span class="pair">${out}</span>`:out;
}
function changedKeys(){return ICONS.filter(it=>choices[it.key]!==it.rec).map(it=>it.key);}
function fmtAgo(iso){
  if(!iso)return '';
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  return new Date(iso).toLocaleDateString('ko-KR');
}

function cardHTML(it){
  const cur=choices[it.key],changed=cur!==it.rec;
  const opts=[...new Set([it.rec,...it.alts])];
  return `<div class="card ${changed?'changed':''}" data-key="${esc(it.key)}">
    <span class="tag">변경됨</span>
    <div class="name">${esc(it.key)}</div>
    <div class="where">${esc(it.where)}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${o===cur?'on':''}" data-pick="${esc(o)}" title="${esc(o)}">${svg(o)}<span>${i===0?'추천':'대안 '+i}</span></button>`).join('')}</div>
    <div class="lname">${esc(cur)}${changed?' <s>'+esc(it.rec)+'</s>':''}</div>
  </div>`;
}
function groupHTML(g){
  const items=ICONS.filter(it=>it.g===g.n);
  return `<section class="group" id="g${g.n}" data-label="${g.c}">
    <h2><span class="badge">${g.c}</span>${esc(g.name)}<small>${items.length}개</small></h2>
    <p class="sub">${esc(g.sub)}</p>
    <div class="grid">${items.map(cardHTML).join('')}</div>
    ${g.n===1?`<div class="preview"><div class="phone-mini" id="tabprev"></div><div class="cap">홈 탭이 켜진 상태</div></div>`:''}
  </section>`;
}
function renderTabPreview(){
  const el=$('#tabprev');if(!el)return;
  el.innerHTML=`<div class="body">
    <div class="row"><i></i>오후 1시 박 팀장 (신랑측)<span class="t">10/18 토</span></div>
    <div class="row"><i></i>오후 6시 대학 동기 (신부측)<span class="t">10/18 토</span></div>
  </div>
  <div class="tabbar">${TAB_KEYS.map((k,i)=>`<div class="tab ${i===0?'on':''}">${svg(choices[k])}<span>${TAB_LABELS[i]}</span></div>`).join('')}</div>
  <div class="hind"><i></i></div>`;
}
function renderCard(key){
  const it=ICONS.find(x=>x.key===key);
  const old=document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  if(!old)return;
  const tmp=document.createElement('div');tmp.innerHTML=cardHTML(it);
  old.replaceWith(tmp.firstElementChild);
  if(TAB_KEYS.includes(key))renderTabPreview();
}
function renderStats(){
  const ch=changedKeys();
  $('#count').innerHTML=`바뀐 항목 <b>${ch.length}</b>개`;
  $('#changed-n').textContent=ch.length+'개';
  $('#saved').textContent=(SAVED?ICONS.length:0)+'/'+ICONS.length;
  $('#saved-at').textContent=SAVED?`저장됨 ✓ ${fmtAgo(SAVED.updatedAt)}`:'';
  $('#all-rec').textContent=SAVED&&SAVED.text==='추천대로'&&ch.length===0?'추천대로 저장됨 ✓':'전체 추천대로 할게요';
}
function renderAll(){
  $('#main').innerHTML=GROUPS.map(groupHTML).join('');
  $('#nav').innerHTML=GROUPS.map(g=>`<a href="#g${g.n}">${g.c} ${esc(g.name)}</a>`).join('');
  renderTabPreview();renderStats();
}

/* 저장 */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
async function persist(doc){
  if(dbReady&&db){await db.doc(DOC).set(doc);}
  else{
    try{localStorage.setItem(LS_KEY,JSON.stringify(doc));}
    catch(_){throw {code:'unavailable',message:'localStorage 실패'};}
  }
}
async function save(allRec){
  const ch=changedKeys();
  const doc={unit:'icons',n:0,label:'아이콘',choices:{...choices},changed:ch,
    text:allRec||ch.length===0?'추천대로':'',updatedAt:new Date().toISOString()};
  try{await persist(doc);SAVED=doc;renderStats();toast('저장됨 ✓');}
  catch(e){
    console.warn('icons save failed',e&&e.code,e);
    const c=e&&e.code;
    toast(c==='not_granted'?'저장 권한이 없어요 — 페이지를 다시 열어 주세요':c==='rate_limited'?'잠시 후 다시 눌러 주세요':'저장 실패, 다시 눌러 주세요');
  }
}

/* 이벤트 */
$('#main').addEventListener('click',async e=>{
  const pick=e.target.closest('[data-pick]');if(!pick)return;
  const card=pick.closest('.card');if(!card)return;
  const key=card.dataset.key,v=pick.dataset.pick;
  if(choices[key]===v)return;
  choices[key]=v;
  renderCard(key);renderStats();
  await save(false);
});
$('#all-rec').addEventListener('click',async()=>{
  const btn=$('#all-rec');btn.disabled=true;btn.textContent='저장 중…';
  ICONS.forEach(it=>choices[it.key]=it.rec);
  renderAll();
  await save(true);
  btn.disabled=false;renderStats();
});

/* 복원 */
function applyLoaded(data){
  if(!data||!data.choices)return;
  ICONS.forEach(it=>{const v=data.choices[it.key];if(typeof v==='string'&&[it.rec,...it.alts].includes(v))choices[it.key]=v;});
  SAVED=data;renderAll();
}
async function init(){
  renderAll();
  try{db=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;}
  catch(e){db=null;}
  if(db){
    dbReady=true;
    try{const snap=await db.doc(DOC).get();if(snap.exists)applyLoaded(snap.data());}
    catch(e){console.warn('icons load failed',e&&e.code,e);toast('저장된 선택을 불러오지 못했어요');}
  }else{
    $('#warn').hidden=false;
    let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(_){}
    applyLoaded(d);
  }
}
init();
</script>
